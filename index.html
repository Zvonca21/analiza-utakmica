<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Analiza nogometnih utakmica</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 8px;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 14px;
    border-radius: 14px;
}

h1 {
    text-align: center;
    font-size: 25px;
}

.opis {
    text-align: center;
    color: #555;
    line-height: 1.5;
    margin-bottom: 20px;
}

input[type="file"] {
    width: 100%;
    margin: 15px 0;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    background: #1976d2;
    color: white;
    border: 0;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
}

button:disabled {
    background: #999;
}

#status {
    margin-top: 16px;
    padding: 12px;
    background: #eee;
    border-radius: 9px;
    text-align: center;
    font-weight: bold;
}

.grupa {
    margin-top: 25px;
}

.grupa h2 {
    background: #1976d2;
    color: white;
    padding: 12px;
    border-radius: 9px;
    font-size: 21px;
}

.utakmica {
    border: 1px solid #ddd;
    border-radius: 9px;
    background: #fafafa;
    padding: 13px;
    margin-bottom: 18px;
}

.par {
    font-size: 18px;
    font-weight: bold;
}

.liga {
    margin-top: 6px;
    color: #555;
}

.kvote {
    margin-top: 10px;
}

.tip {
    margin-top: 8px;
    font-weight: bold;
}

.nema {
    padding: 20px;
    margin-top: 20px;
    text-align: center;
    background: #fff3cd;
    border-radius: 9px;
}

details {
    margin-top: 20px;
    background: #f7f7f7;
    padding: 10px;
    border-radius: 8px;
}

pre {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

<h1>Analiza nogometnih utakmica</h1>

<div class="opis">
Prikazuju se samo tipovi
<strong>2:0, 2:1, 3:0, 3:1, 4:0 i 4:1</strong><br>
uz kvotu domaćina <strong>1.60 ili manju</strong>.
</div>

<input type="file" id="slike" accept="image/*" multiple>

<button id="gumb" onclick="analizirajSlike()">
Analiziraj slike
</button>

<div id="status">Spremno za analizu.</div>

<div id="rezultati"></div>

<details>
<summary>OCR pročitao</summary>
<pre id="ocrTekst"></pre>
</details>

</div>

<script>

const TIPOVI = ["2:0","2:1","3:0","3:1","4:0","4:1"];

const REDOSLIJED = {
    "2:0": 0,
    "2:1": 1,
    "3:0": 2,
    "3:1": 3,
    "4:0": 4,
    "4:1": 5
};

function normalizirajRed(red) {
    return red
        .replace(/\r/g, "")
        .replace(/\t/g, " ")
        .replace(/[|]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}

function popraviKvoteToken(token) {
    if (!token) return null;

    let s = token
        .trim()
        .replace(",", ".")
        .replace(/[Oo]/g, "0")
        .replace(/[Il]/g, "1")
        .replace(/[^\d.]/g, "");

    if (!s) return null;

    if (s.includes(".")) {
        const n = parseFloat(s);
        return isNaN(n) ? null : n;
    }

    if (!/^\d+$/.test(s)) return null;

    if (s.length === 3) {
        return parseFloat(
            s.slice(0, 1) + "." + s.slice(1)
        );
    }

    if (s.length === 4) {
        return parseFloat(
            s.slice(0, 2) + "." + s.slice(2)
        );
    }

    return null;
}

function popraviTipToken(token) {
    if (!token) return null;

    let s = token
        .trim()
        .replace(/[Oo]/g, "0")
        .replace(/[Il]/g, "1")
        .replace(/\s/g, "")
        .replace(/[;.,-]/g, ":");

    let m = s.match(/^([0-9]):([0-9])$/);
    if (m) return `${m[1]}:${m[2]}`;

    m = s.match(/^([234])([01])$/);
    if (m) return `${m[1]}:${m[2]}`;

    return null;
}

function jeVrijeme(token) {
    return /^([01]?\d|2[0-3]):[0-5]\d$/.test(token);
}

function jeLiga(red) {
    if (/\b([01]?\d|2[0-3]):[0-5]\d\b/.test(red)) {
        return false;
    }

    const r = red.toLowerCase();

    const rijeci = [
        "liga",
        "league",
        "premier",
        "premiership",
        "division",
        "división",
        "serie",
        "bundesliga",
        "superliga",
        "championship",
        "ettan",
        "allsvenskan",
        "damallsvenskan",
        "segunda",
        "primera",
        "süper",
        "snl",
        "cup"
    ];

    return rijeci.some(x => r.includes(x));
}

function ocistiLigu(red) {
    return red
        .replace(/^[^A-Za-zÀ-ž]+/, "")
        .replace(/\b1\s*[xX]\s*2\s*[Tt]p\b/g, "")
        .replace(/\b1\s+[xX]\s+2\s+[Tt]ip\b/g, "")
        .replace(/\s+/g, " ")
        .trim();
}

function segmentirajPoVremenima(text) {

    const normal = text
        .replace(/\r/g, "")
        .replace(/[|]/g, " ")
        .replace(/\n+/g, " ")
        .replace(/\s+/g, " ")
        .trim();

    const dijelovi = normal.split(
        /(?=\b(?:[01]?\d|2[0-3]):[0-5]\d\b)/
    );

    return dijelovi
        .map(x => x.trim())
        .filter(Boolean);
}

function pronadjiTipUTekstu(segment) {

    const tokeni = segment.split(/\s+/);

    for (let i = tokeni.length - 1; i >= 0; i--) {

        const tip = popraviTipToken(tokeni[i]);

        if (tip && TIPOVI.includes(tip)) {
            return {
                tip,
                index: i
            };
        }
    }

    return null;
}

function pronadjiKvotePrijeTipa(tokeni, tipIndex) {

    const brojevi = [];

    for (let i = tipIndex - 1; i >= 0; i--) {

        const n = popraviKvoteToken(tokeni[i]);

        if (n !== null) {
            brojevi.unshift({
                value: n,
                index: i
            });

            if (brojevi.length === 3) {
                break;
            }
        }
    }

    if (brojevi.length !== 3) {
        return null;
    }

    return {
        jedan: brojevi[0].value,
        x: brojevi[1].value,
        dva: brojevi[2].value,
        prviIndex: brojevi[0].index
    };
}

function obradiSegment(segment, trenutnaLiga) {

    const tokeni = segment.split(/\s+/);

    if (!tokeni.length) return null;

    if (!jeVrijeme(tokeni[0])) {
        return null;
    }

    const vrijeme = tokeni[0];

    const pronadjeniTip =
        pronadjiTipUTekstu(segment);

    if (!pronadjeniTip) {
        return null;
    }

    const tip = pronadjeniTip.tip;

    const kvote =
        pronadjiKvotePrijeTipa(
            tokeni,
            pronadjeniTip.index
        );

    if (!kvote) {
        return null;
    }

    if (
        kvote.jedan < 1.01 ||
        kvote.jedan > 1.60
    ) {
        return null;
    }

    const nazivTokeni =
        tokeni.slice(
            1,
            kvote.prviIndex
        );

    let naziv =
        nazivTokeni
            .join(" ")
            .replace(/\s+/g, " ")
            .trim();

    if (!naziv.includes("-")) {
        return null;
    }

    const dijelovi =
        naziv.split(/\s*-\s*/);

    if (dijelovi.length < 2) {
        return null;
    }

    const domacin =
        dijelovi[0].trim();

    const gost =
        dijelovi
            .slice(1)
            .join(" - ")
            .trim();

    if (!domacin || !gost) {
        return null;
    }

    return {
        vrijeme,
        liga: trenutnaLiga,
        domacin,
        gost,
        jedan: kvote.jedan,
        x: kvote.x,
        dva: kvote.dva,
        tip
    };
}

function obradiOCR(text) {

    const redovi = text
        .split("\n")
        .map(normalizirajRed)
        .filter(Boolean);

    let trenutnaLiga =
        "Nepoznata liga";

    const utakmice = [];

    let buffer = "";

    function obradiBuffer() {

        if (!buffer) return;

        const segmenti =
            segmentirajPoVremenima(
                buffer
            );

        for (const segment of segmenti) {

            const u =
                obradiSegment(
                    segment,
                    trenutnaLiga
                );

            if (u) {
                utakmice.push(u);
            }
        }

        buffer = "";
    }

    for (const red of redovi) {

        if (jeLiga(red)) {

            obradiBuffer();

            const novaLiga =
                ocistiLigu(red);

            if (novaLiga) {
                trenutnaLiga =
                    novaLiga;
            }

            continue;
        }

        if (
            /\b([01]?\d|2[0-3]):[0-5]\d\b/.test(red)
        ) {

            if (buffer) {
                obradiBuffer();
            }

            buffer = red;

        } else {

            if (buffer) {
                buffer += " " + red;
            }
        }
    }

    obradiBuffer();

    return utakmice;
}

function ukloniDuplikate(lista) {

    const set = new Set();

    return lista.filter(u => {

        const key = [
            u.liga,
            u.domacin,
            u.gost,
            u.tip,
            u.jedan
        ].join("|").toLowerCase();

        if (set.has(key)) {
            return false;
        }

        set.add(key);

        return true;
    });
}

function sortiraj(lista) {

    return lista.sort((a, b) => {

        const A = REDOSLIJED[a.tip];
        const B = REDOSLIJED[b.tip];

        if (A !== B) {
            return A - B;
        }

        return a.jedan - b.jedan;
    });
}

function prikazi(lista) {

    const container =
        document.getElementById(
            "rezultati"
        );

    container.innerHTML = "";

    if (!lista.length) {

        container.innerHTML = `
            <div class="nema">
                Nema pronađenih utakmica koje zadovoljavaju uvjete.
            </div>
        `;

        return;
    }

    for (const tip of TIPOVI) {

        const grupa =
            lista.filter(
                u => u.tip === tip
            );

        if (!grupa.length) {
            continue;
        }

        const box =
            document.createElement("div");

        box.className = "grupa";

        const naslov =
            document.createElement("h2");

        naslov.textContent =
            "Tip " + tip;

        box.appendChild(naslov);

        for (const u of grupa) {

            const div =
                document.createElement("div");

            div.className =
                "utakmica";

            div.innerHTML = `
                <div class="par">
                    ${u.vrijeme} ${u.domacin} - ${u.gost}
                </div>

                <div class="liga">
                    (${u.liga})
                </div>

                <div class="kvote">
                    1:
                    <strong>${u.jedan.toFixed(2)}</strong>
                    &nbsp;&nbsp;
                    X: ${u.x.toFixed(2)}
                    &nbsp;&nbsp;
                    2: ${u.dva.toFixed(2)}
                </div>

                <div class="tip">
                    Tip: ${u.tip}
                </div>
            `;

            box.appendChild(div);
        }

        container.appendChild(box);
    }
}

async function analizirajSlike() {

    const input =
        document.getElementById(
            "slike"
        );

    const status =
        document.getElementById(
            "status"
        );

    const gumb =
        document.getElementById(
            "gumb"
        );

    const ocrTekst =
        document.getElementById(
            "ocrTekst"
        );

    if (
        !input.files ||
        input.files.length === 0
    ) {

        alert(
            "Prvo odaberi sliku."
        );

        return;
    }

    gumb.disabled = true;

    document.getElementById(
        "rezultati"
    ).innerHTML = "";

    ocrTekst.textContent = "";

    let sve = [];
    let debug = "";

    try {

        for (
            let i = 0;
            i < input.files.length;
            i++
        ) {

            const file =
                input.files[i];

            const rezultat =
                await Tesseract.recognize(
                    file,
                    "eng",
                    {
                        logger: m => {

                            if (
                                m.status ===
                                "recognizing text"
                            ) {

                                const p =
                                    Math.round(
                                        m.progress * 100
                                    );

                                status.textContent =
                                    `Slika ${i + 1}/${input.files.length} - ${p}%`;
                            }
                        }
                    }
                );

            const tekst =
                rezultat.data.text || "";

            debug +=
                `\n\n===== SLIKA ${i + 1} =====\n${tekst}`;

            const pronadjene =
                obradiOCR(
                    tekst
                );

            sve.push(
                ...pronadjene
            );
        }

        ocrTekst.textContent =
            debug;

        sve =
            ukloniDuplikate(sve);

        sve =
            sortiraj(sve);

        prikazi(sve);

        status.textContent =
            `Gotovo. Pronađeno utakmica: ${sve.length}`;

    } catch (e) {

        console.error(e);

        status.textContent =
            "Greška tijekom analize.";

        alert(
            "Dogodila se greška tijekom čitanja slike."
        );

    } finally {

        gumb.disabled =
            false;
    }
}

</script>

</body>
</html>
