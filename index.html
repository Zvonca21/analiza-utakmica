<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Analiza nogometnih utakmica</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 8px;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 14px;
    border-radius: 14px;
}

h1 {
    text-align: center;
    font-size: 25px;
}

.opis {
    text-align: center;
    color: #555;
    line-height: 1.5;
    margin-bottom: 20px;
}

input[type="file"] {
    width: 100%;
    margin: 15px 0;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    background: #1976d2;
    color: white;
    border: 0;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
}

button:disabled {
    background: #999;
}

#status {
    margin-top: 16px;
    padding: 12px;
    background: #eee;
    border-radius: 9px;
    text-align: center;
    font-weight: bold;
}

.grupa {
    margin-top: 25px;
}

.grupa h2 {
    background: #1976d2;
    color: white;
    padding: 12px;
    border-radius: 9px;
    font-size: 21px;
}

.utakmica {
    border: 1px solid #ddd;
    border-radius: 9px;
    background: #fafafa;
    padding: 13px;
    margin-bottom: 18px;
}

.par {
    font-size: 18px;
    font-weight: bold;
}

.liga {
    margin-top: 6px;
    color: #555;
    font-size: 15px;
}

.kvote {
    margin-top: 10px;
    font-size: 16px;
}

.tip {
    margin-top: 8px;
    font-size: 17px;
    font-weight: bold;
}

.nema {
    padding: 20px;
    margin-top: 20px;
    text-align: center;
    background: #fff3cd;
    border-radius: 9px;
}

#debug {
    margin-top: 15px;
    font-size: 12px;
    white-space: pre-wrap;
    display: none;
}
</style>
</head>

<body>

<div class="container">

<h1>Analiza nogometnih utakmica</h1>

<div class="opis">
Odaberi jednu ili više slika.<br>
Prikazuju se samo tipovi
<strong>2:0, 2:1, 3:0, 3:1, 4:0 i 4:1</strong><br>
uz kvotu domaćina <strong>1.60 ili manju</strong>.
</div>

<input
    type="file"
    id="slike"
    accept="image/*"
    multiple
>

<button id="gumb" onclick="analizirajSlike()">
Analiziraj slike
</button>

<div id="status">
Spremno za analizu.
</div>

<div id="rezultati"></div>

<pre id="debug"></pre>

</div>

<script>

const TIPOVI = [
    "2:0",
    "2:1",
    "3:0",
    "3:1",
    "4:0",
    "4:1"
];

const REDOSLIJED = {
    "2:0": 0,
    "2:1": 1,
    "3:0": 2,
    "3:1": 3,
    "4:0": 4,
    "4:1": 5
};


/* ================================
   POMOĆNE FUNKCIJE
================================ */

function broj(text) {

    if (!text) return null;

    let s = String(text)
        .trim()
        .replace(",", ".")
        .replace(/[Oo]/g, "0")
        .replace(/[Il]/g, "1");

    const m = s.match(/\d{1,2}\.\d{1,2}/);

    if (!m) return null;

    const n = parseFloat(m[0]);

    return isNaN(n) ? null : n;
}


function popraviTip(text) {

    if (!text) return null;

    let s = String(text)
        .replace(/\s/g, "")
        .replace(/[;.,]/g, ":")
        .replace(/-/g, ":")
        .replace(/[Oo]/g, "0")
        .replace(/[Il]/g, "1");

    const m = s.match(/[0-9]:[0-9]/);

    if (!m) return null;

    return m[0];
}


function jeVrijeme(text) {

    if (!text) return false;

    return /^([01]?\d|2[0-3]):[0-5]\d$/.test(
        text.trim()
    );
}


function centarY(word) {

    return (
        word.bbox.y0 +
        word.bbox.y1
    ) / 2;
}


function centarX(word) {

    return (
        word.bbox.x0 +
        word.bbox.x1
    ) / 2;
}


/* ================================
   GRUPIRANJE OCR RIJEČI U REDOVE
================================ */

function napraviRedove(words) {

    const ciste = words.filter(w => {

        if (!w.text) return false;

        const txt = w.text.trim();

        if (!txt) return false;

        return true;
    });

    ciste.sort((a, b) => {

        const ya = centarY(a);
        const yb = centarY(b);

        if (Math.abs(ya - yb) < 8) {
            return a.bbox.x0 - b.bbox.x0;
        }

        return ya - yb;
    });


    const redovi = [];

    for (const word of ciste) {

        const y = centarY(word);

        let najbolji = null;
        let najmanjaRazlika = Infinity;

        for (const red of redovi) {

            const razlika =
                Math.abs(red.y - y);

            if (
                razlika < najmanjaRazlika &&
                razlika <= 10
            ) {

                najmanjaRazlika = razlika;
                najbolji = red;
            }
        }

        if (!najbolji) {

            najbolji = {
                y: y,
                words: []
            };

            redovi.push(najbolji);
        }

        najbolji.words.push(word);

        najbolji.y =
            najbolji.words.reduce(
                (sum, w) => sum + centarY(w),
                0
            ) / najbolji.words.length;
    }


    redovi.sort((a, b) => a.y - b.y);

    for (const red of redovi) {

        red.words.sort(
            (a, b) =>
                a.bbox.x0 -
                b.bbox.x0
        );
    }

    return redovi;
}


/* ================================
   PREPOZNAVANJE STUPACA
================================ */

function analizirajRed(red, sirina) {

    const dijelovi = {
        vrijeme: [],
        naziv: [],
        jedan: [],
        x: [],
        dva: [],
        tip: [],
        ostalo: []
    };


    for (const w of red.words) {

        const x =
            centarX(w) / sirina;

        const txt =
            w.text.trim();


        /*
          STUPCI IZ TVOJE TABLICE

          Vrijeme  ~ 0.26 - 0.31
          Naziv    ~ 0.31 - 0.56
          1        ~ 0.56 - 0.61
          X        ~ 0.61 - 0.65
          2        ~ 0.65 - 0.70
          Tip      ~ 0.69 - 0.73
        */


        if (x < 0.31) {

            dijelovi.vrijeme.push(txt);

        } else if (x < 0.56) {

            dijelovi.naziv.push(txt);

        } else if (x < 0.61) {

            dijelovi.jedan.push(txt);

        } else if (x < 0.655) {

            dijelovi.x.push(txt);

        } else if (x < 0.695) {

            dijelovi.dva.push(txt);

        } else if (x < 0.735) {

            dijelovi.tip.push(txt);

        } else {

            dijelovi.ostalo.push(txt);
        }
    }


    return {
        vrijeme:
            dijelovi.vrijeme.join(" ").trim(),

        naziv:
            dijelovi.naziv.join(" ").trim(),

        jedan:
            dijelovi.jedan.join("").trim(),

        x:
            dijelovi.x.join("").trim(),

        dva:
            dijelovi.dva.join("").trim(),

        tip:
            dijelovi.tip.join("").trim(),

        cijeli:
            red.words
                .map(w => w.text)
                .join(" ")
                .trim()
    };
}


/* ================================
   PREPOZNAVANJE LIGE
================================ */

function jeLiga(parsed) {

    const naziv =
        parsed.naziv.trim();

    if (!naziv) return false;

    if (jeVrijeme(parsed.vrijeme)) {
        return false;
    }

    const cijeli =
        parsed.cijeli.toLowerCase();

    /*
      Zaglavlje stupaca nije liga
    */

    if (
        /\btip\b/i.test(cijeli) &&
        /\b1\b/.test(cijeli) &&
        /\b2\b/.test(cijeli)
    ) {
        return false;
    }


    const ligaRijeci = [
        "liga",
        "league",
        "premier",
        "premiership",
        "division",
        "división",
        "divizion",
        "serie",
        "bundesliga",
        "superliga",
        "super league",
        "championship",
        "ettan",
        "allsvenskan",
        "damallsvenskan",
        "segunda",
        "primera",
        "süper",
        "1. snl",
        "2. snl",
        "cup"
    ];


    if (
        ligaRijeci.some(r =>
            naziv.toLowerCase().includes(r)
        )
    ) {
        return true;
    }


    /*
      Naslovi liga često nemaju vrijeme,
      a zauzimaju nazivni stupac.
    */

    if (
        !parsed.vrijeme &&
        naziv.length >= 5 &&
        !broj(parsed.jedan) &&
        !broj(parsed.x) &&
        !broj(parsed.dva)
    ) {
        return true;
    }


    return false;
}


/* ================================
   ČITANJE JEDNE SLIKE
================================ */

async function obradiSliku(file, brojSlike, ukupno) {

    const status =
        document.getElementById("status");


    const rezultat =
        await Tesseract.recognize(
            file,
            "eng",
            {
                logger: m => {

                    if (
                        m.status ===
                        "recognizing text"
                    ) {

                        const p =
                            Math.round(
                                m.progress * 100
                            );

                        status.textContent =
                            `Slika ${brojSlike}/${ukupno} - ${p}%`;
                    }
                }
            }
        );


    /*
      Tesseract v5 može vratiti words.
      Ako words nisu dostupne, uzimamo simbole
      iz blocks strukture.
    */

    let words =
        rezultat.data.words || [];


    if (
        (!words || !words.length) &&
        rezultat.data.blocks
    ) {

        words = [];

        for (
            const block of rezultat.data.blocks
        ) {

            for (
                const paragraph of
                block.paragraphs || []
            ) {

                for (
                    const line of
                    paragraph.lines || []
                ) {

                    for (
                        const word of
                        line.words || []
                    ) {

                        words.push(word);
                    }
                }
            }
        }
    }


    if (!words.length) {

        console.log(
            "Tesseract nije vratio položaje riječi."
        );

        return [];
    }


    const sirina =
        rezultat.data.width ||
        Math.max(
            ...words.map(w => w.bbox.x1)
        );


    const redovi =
        napraviRedove(words);


    let trenutnaLiga =
        "Nepoznata liga";

    const utakmice = [];


    for (const red of redovi) {

        const p =
            analizirajRed(
                red,
                sirina
            );


        /*
          LIGA
        */

        if (jeLiga(p)) {

            let nazivLige =
                p.naziv
                    .replace(
                        /\b1\s+X\s+2\s+Tip\b/gi,
                        ""
                    )
                    .trim();

            if (nazivLige) {
                trenutnaLiga =
                    nazivLige;
            }

            continue;
        }


        /*
          UTAKMICA MORA IMATI VRIJEME
        */

        let vrijeme =
            p.vrijeme
                .split(/\s+/)
                .find(jeVrijeme);


        if (!vrijeme) {
            continue;
        }


        /*
          NAZIV PARA
        */

        let naziv =
            p.naziv
                .replace(/\s+/g, " ")
                .trim();


        if (
            !naziv ||
            !naziv.includes("-")
        ) {
            continue;
        }


        /*
          KVOTE
        */

        const q1 =
            broj(p.jedan);

        const qx =
            broj(p.x);

        const q2 =
            broj(p.dva);


        if (
            q1 === null ||
            qx === null ||
            q2 === null
        ) {
            continue;
        }


        /*
          TIP
        */

        const tip =
            popraviTip(p.tip);


        if (!tip) {
            continue;
        }


        /*
          SAMO DOZVOLJENI TIPOVI
        */

        if (
            !TIPOVI.includes(tip)
        ) {
            continue;
        }


        /*
          KVOTA NA DOMAĆINA
          ≤ 1.60 UKLJUČUJUĆI 1.60
        */

        if (
            q1 < 1.01 ||
            q1 > 1.60
        ) {
            continue;
        }


        /*
          OSNOVNA PROVJERA OSTALIH KVOTA
        */

        if (
            qx < 1 ||
            q2 < 1
        ) {
            continue;
        }


        const dijelovi =
            naziv.split(/\s+-\s+/);


        let domacin =
            dijelovi[0]
                ? dijelovi[0].trim()
                : naziv;


        let gost =
            dijelovi.length > 1
                ? dijelovi
                    .slice(1)
                    .join(" - ")
                    .trim()
                : "";


        utakmice.push({

            vrijeme,
            liga: trenutnaLiga,
            domacin,
            gost,
            jedan: q1,
            x: qx,
            dva: q2,
            tip
        });
    }


    return utakmice;
}


/* ================================
   DUPLIKATI
================================ */

function ukloniDuplikate(lista) {

    const set = new Set();

    return lista.filter(u => {

        const key = [
            u.liga,
            u.domacin,
            u.gost,
            u.tip,
            u.jedan
        ]
        .join("|")
        .toLowerCase();


        if (set.has(key)) {
            return false;
        }


        set.add(key);

        return true;
    });
}


/* ================================
   SORTIRANJE
================================ */

function sortiraj(lista) {

    return lista.sort((a, b) => {

        const A =
            REDOSLIJED[a.tip];

        const B =
            REDOSLIJED[b.tip];


        if (A !== B) {
            return A - B;
        }


        return (
            a.jedan -
            b.jedan
        );
    });
}


/* ================================
   PRIKAZ
================================ */

function prikazi(lista) {

    const container =
        document.getElementById(
            "rezultati"
        );


    container.innerHTML = "";


    if (!lista.length) {

        container.innerHTML = `
            <div class="nema">
                Nema pronađenih utakmica koje zadovoljavaju uvjete.
            </div>
        `;

        return;
    }


    for (const tip of TIPOVI) {

        const grupa =
            lista.filter(
                u => u.tip === tip
            );


        if (!grupa.length) {
            continue;
        }


        const box =
            document.createElement(
                "div"
            );

        box.className =
            "grupa";


        const naslov =
            document.createElement(
                "h2"
            );

        naslov.textContent =
            "Tip " + tip;


        box.appendChild(
            naslov
        );


        for (const u of grupa) {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "utakmica";


            div.innerHTML = `

                <div class="par">
                    ${u.vrijeme}
                    ${u.domacin}
                    -
                    ${u.gost}
                </div>

                <div class="liga">
                    (${u.liga})
                </div>

                <div class="kvote">

                    1:
                    <strong>
                        ${u.jedan.toFixed(2)}
                    </strong>

                    &nbsp;&nbsp;

                    X:
                    ${u.x.toFixed(2)}

                    &nbsp;&nbsp;

                    2:
                    ${u.dva.toFixed(2)}

                </div>

                <div class="tip">
                    Tip: ${u.tip}
                </div>
            `;


            box.appendChild(
                div
            );
        }


        container.appendChild(
            box
        );
    }
}


/* ================================
   GLAVNA ANALIZA
================================ */

async function analizirajSlike() {

    const input =
        document.getElementById(
            "slike"
        );

    const status =
        document.getElementById(
            "status"
        );

    const gumb =
        document.getElementById(
            "gumb"
        );


    if (
        !input.files ||
        input.files.length === 0
    ) {

        alert(
            "Prvo odaberi slike."
        );

        return;
    }


    gumb.disabled = true;

    document.getElementById(
        "rezultati"
    ).innerHTML = "";


    let sve = [];


    try {

        for (
            let i = 0;
            i < input.files.length;
            i++
        ) {

            status.textContent =
                `Čitam sliku ${i + 1} od ${input.files.length}...`;


            const utakmice =
                await obradiSliku(
                    input.files[i],
                    i + 1,
                    input.files.length
                );


            sve.push(
                ...utakmice
            );
        }


        sve =
            ukloniDuplikate(sve);


        sve =
            sortiraj(sve);


        prikazi(sve);


        status.textContent =
            `Gotovo. Pronađeno utakmica: ${sve.length}`;


    } catch (greska) {

        console.error(greska);

        status.textContent =
            "Greška tijekom analize.";

        alert(
            "Dogodila se greška tijekom čitanja slike."
        );


    } finally {

        gumb.disabled =
            false;
    }
}

</script>

</body>
</html>
