<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Analiza nogometnih utakmica</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 8px;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 14px;
    border-radius: 14px;
}

h1 {
    text-align: center;
    font-size: 25px;
}

.opis {
    text-align: center;
    color: #555;
    line-height: 1.5;
    margin-bottom: 20px;
}

input[type="file"] {
    width: 100%;
    margin: 15px 0;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    background: #1976d2;
    color: white;
    border: 0;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
}

button:disabled {
    background: #999;
}

#status {
    margin-top: 16px;
    padding: 12px;
    background: #eee;
    border-radius: 9px;
    text-align: center;
    font-weight: bold;
}

.grupa {
    margin-top: 25px;
}

.grupa h2 {
    background: #1976d2;
    color: white;
    padding: 12px;
    border-radius: 9px;
    font-size: 21px;
}

.utakmica {
    border: 1px solid #ddd;
    border-radius: 9px;
    background: #fafafa;
    padding: 13px;
    margin-bottom: 18px;
}

.par {
    font-size: 18px;
    font-weight: bold;
}

.liga {
    margin-top: 6px;
    color: #555;
    font-size: 15px;
}

.kvote {
    margin-top: 10px;
    font-size: 16px;
}

.tip {
    margin-top: 8px;
    font-size: 17px;
    font-weight: bold;
}

.nema {
    padding: 20px;
    margin-top: 20px;
    text-align: center;
    background: #fff3cd;
    border-radius: 9px;
}
</style>
</head>

<body>

<div class="container">

<h1>Analiza nogometnih utakmica</h1>

<div class="opis">
Odaberi jednu ili više slika.<br>
Prikazuju se samo tipovi
<strong>2:0, 2:1, 3:0, 3:1, 4:0 i 4:1</strong><br>
uz kvotu domaćina <strong>1.60 ili manju</strong>.
</div>

<input
    type="file"
    id="slike"
    accept="image/*"
    multiple
>

<button id="gumb" onclick="analizirajSlike()">
Analiziraj slike
</button>

<div id="status">
Spremno za analizu.
</div>

<div id="rezultati"></div>

</div>

<script>

const TIPOVI = [
    "2:0",
    "2:1",
    "3:0",
    "3:1",
    "4:0",
    "4:1"
];

const REDOSLIJED = {
    "2:0": 0,
    "2:1": 1,
    "3:0": 2,
    "3:1": 3,
    "4:0": 4,
    "4:1": 5
};


/* ---------------------------
   POMOĆNE FUNKCIJE
--------------------------- */

function broj(text) {

    if (!text) return null;

    let s = String(text)
        .trim()
        .replace(",", ".")
        .replace(/[Oo]/g, "0")
        .replace(/[Il]/g, "1");

    const m = s.match(/\d{1,2}\.\d{1,2}/);

    if (!m) return null;

    const n = parseFloat(m[0]);

    return isNaN(n) ? null : n;
}


function popraviTip(text) {

    if (!text) return null;

    let s = String(text)
        .replace(/\s/g, "")
        .replace(/[;.,]/g, ":")
        .replace(/-/g, ":")
        .replace(/[Oo]/g, "0")
        .replace(/[Il]/g, "1");

    const m = s.match(/[0-9]:[0-9]/);

    return m ? m[0] : null;
}


function jeVrijeme(text) {

    if (!text) return false;

    return /^([01]?\d|2[0-3]):[0-5]\d$/.test(
        text.trim()
    );
}


function centarY(word) {

    return (
        word.bbox.y0 +
        word.bbox.y1
    ) / 2;
}


function centarX(word) {

    return (
        word.bbox.x0 +
        word.bbox.x1
    ) / 2;
}


/* ---------------------------
   IZVLAČENJE RIJEČI IZ BLOCKS
--------------------------- */

function izvuciWordsIzBlocks(blocks) {

    const words = [];

    if (!blocks) return words;

    for (const block of blocks) {

        const paragraphs =
            block.paragraphs || [];

        for (const paragraph of paragraphs) {

            const lines =
                paragraph.lines || [];

            for (const line of lines) {

                const lineWords =
                    line.words || [];

                for (const word of lineWords) {

                    if (
                        word &&
                        word.text &&
                        word.bbox
                    ) {

                        words.push(word);
                    }
                }
            }
        }
    }

    return words;
}


/* ---------------------------
   GRUPIRANJE RIJEČI U REDOVE
--------------------------- */

function napraviRedove(words) {

    const ciste = words
        .filter(w =>
            w.text &&
            w.text.trim() &&
            w.bbox
        )
        .sort((a, b) => {

            const ya = centarY(a);
            const yb = centarY(b);

            if (Math.abs(ya - yb) <= 8) {
                return a.bbox.x0 - b.bbox.x0;
            }

            return ya - yb;
        });


    const redovi = [];


    for (const word of ciste) {

        const y = centarY(word);

        let najbolji = null;
        let najmanjaRazlika = Infinity;


        for (const red of redovi) {

            const razlika =
                Math.abs(red.y - y);

            if (
                razlika <= 12 &&
                razlika < najmanjaRazlika
            ) {

                najbolji = red;
                najmanjaRazlika = razlika;
            }
        }


        if (!najbolji) {

            najbolji = {
                y: y,
                words: []
            };

            redovi.push(najbolji);
        }


        najbolji.words.push(word);


        najbolji.y =
            najbolji.words.reduce(
                (sum, w) =>
                    sum + centarY(w),
                0
            ) / najbolji.words.length;
    }


    redovi.sort((a, b) =>
        a.y - b.y
    );


    for (const red of redovi) {

        red.words.sort(
            (a, b) =>
                a.bbox.x0 -
                b.bbox.x0
        );
    }


    return redovi;
}


/* ---------------------------
   ANALIZA PO STUPCIMA
--------------------------- */

function analizirajRed(red, sirina) {

    const dijelovi = {
        vrijeme: [],
        naziv: [],
        jedan: [],
        x: [],
        dva: [],
        tip: [],
        ostalo: []
    };


    for (const w of red.words) {

        const x =
            centarX(w) / sirina;

        const txt =
            w.text.trim();


        /*
            Prilagođeno tvojoj tablici
        */

        if (x < 0.31) {

            dijelovi.vrijeme.push(txt);

        } else if (x < 0.56) {

            dijelovi.naziv.push(txt);

        } else if (x < 0.61) {

            dijelovi.jedan.push(txt);

        } else if (x < 0.655) {

            dijelovi.x.push(txt);

        } else if (x < 0.695) {

            dijelovi.dva.push(txt);

        } else if (x < 0.735) {

            dijelovi.tip.push(txt);

        } else {

            dijelovi.ostalo.push(txt);
        }
    }


    return {

        vrijeme:
            dijelovi.vrijeme.join(" ").trim(),

        naziv:
            dijelovi.naziv.join(" ").trim(),

        jedan:
            dijelovi.jedan.join("").trim(),

        x:
            dijelovi.x.join("").trim(),

        dva:
            dijelovi.dva.join("").trim(),

        tip:
            dijelovi.tip.join("").trim(),

        cijeli:
            red.words
                .map(w => w.text)
                .join(" ")
                .trim()
    };
}


/* ---------------------------
   LIGA
--------------------------- */

function jeLiga(parsed) {

    const naziv =
        parsed.naziv.trim();

    if (!naziv) return false;

    if (jeVrijeme(parsed.vrijeme)) {
        return false;
    }


    const cijeli =
        parsed.cijeli.toLowerCase();


    if (
        cijeli.includes("tip") &&
        cijeli.includes("1") &&
        cijeli.includes("2")
    ) {
        return false;
    }


    const rijeci = [
        "liga",
        "league",
        "premier",
        "premiership",
        "division",
        "división",
        "serie",
        "bundesliga",
        "superliga",
        "super league",
        "championship",
        "ettan",
        "allsvenskan",
        "damallsvenskan",
        "segunda",
        "primera",
        "süper",
        "snl",
        "cup"
    ];


    const malo =
        naziv.toLowerCase();


    if (
        rijeci.some(r =>
            malo.includes(r)
        )
    ) {
        return true;
    }


    if (
        !parsed.vrijeme &&
        naziv.length >= 5 &&
        !broj(parsed.jedan) &&
        !broj(parsed.x) &&
        !broj(parsed.dva)
    ) {
        return true;
    }


    return false;
}


/* ---------------------------
   ČITANJE SLIKE
--------------------------- */

async function obradiSliku(file, brojSlike, ukupno) {

    const status =
        document.getElementById("status");


    const worker =
        await Tesseract.createWorker(
            "eng",
            1,
            {
                logger: m => {

                    if (
                        m.status ===
                        "recognizing text"
                    ) {

                        const p =
                            Math.round(
                                m.progress * 100
                            );

                        status.textContent =
                            `Slika ${brojSlike}/${ukupno} - ${p}%`;
                    }
                }
            }
        );


    const rezultat =
        await worker.recognize(
            file,
            {},
            {
                text: true,
                blocks: true
            }
        );


    await worker.terminate();


    let words = [];


    if (
        rezultat.data.blocks
    ) {

        words =
            izvuciWordsIzBlocks(
                rezultat.data.blocks
            );
    }


    /*
       Rezervna opcija
    */

    if (
        words.length === 0 &&
        rezultat.data.words
    ) {

        words =
            rezultat.data.words;
    }


    console.log(
        "Broj OCR riječi:",
        words.length
    );


    if (!words.length) {
        return [];
    }


    const sirina =
        rezultat.data.width ||
        Math.max(
            ...words.map(
                w => w.bbox.x1
            )
        );


    const redovi =
        napraviRedove(words);


    console.log(
        "Broj redova:",
        redovi.length
    );


    let trenutnaLiga =
        "Nepoznata liga";


    const utakmice = [];


    for (const red of redovi) {

        const p =
            analizirajRed(
                red,
                sirina
            );


        console.log(
            "RED:",
            p
        );


        /*
           Liga
        */

        if (jeLiga(p)) {

            let liga =
                p.naziv
                    .replace(
                        /\b1\s+X\s+2\s+Tip\b/gi,
                        ""
                    )
                    .trim();


            if (liga) {
                trenutnaLiga =
                    liga;
            }

            continue;
        }


        /*
           Vrijeme
        */

        const vrijeme =
            p.vrijeme
                .split(/\s+/)
                .find(jeVrijeme);


        if (!vrijeme) {
            continue;
        }


        /*
           Naziv utakmice
        */

        const naziv =
            p.naziv
                .replace(/\s+/g, " ")
                .trim();


        if (
            !naziv ||
            !naziv.includes("-")
        ) {
            continue;
        }


        /*
           Kvote
        */

        const q1 =
            broj(p.jedan);

        const qx =
            broj(p.x);

        const q2 =
            broj(p.dva);


        if (
            q1 === null ||
            qx === null ||
            q2 === null
        ) {
            continue;
        }


        /*
           Tip
        */

        const tip =
            popraviTip(p.tip);


        if (!tip) {
            continue;
        }


        /*
           Samo dozvoljeni tipovi
        */

        if (
            !TIPOVI.includes(tip)
        ) {
            continue;
        }


        /*
           Kvota domaćina mora biti
           <= 1.60
        */

        if (
            q1 < 1.01 ||
            q1 > 1.60
        ) {
            continue;
        }


        if (
            qx < 1 ||
            q2 < 1
        ) {
            continue;
        }


        const dijelovi =
            naziv.split(
                /\s+-\s+/
            );


        const domacin =
            dijelovi[0]
                ? dijelovi[0].trim()
                : naziv;


        const gost =
            dijelovi.length > 1
                ? dijelovi
                    .slice(1)
                    .join(" - ")
                    .trim()
                : "";


        utakmice.push({

            vrijeme,
            liga: trenutnaLiga,
            domacin,
            gost,
            jedan: q1,
            x: qx,
            dva: q2,
            tip
        });
    }


    return utakmice;
}


/* ---------------------------
   DUPLIKATI
--------------------------- */

function ukloniDuplikate(lista) {

    const set =
        new Set();


    return lista.filter(u => {

        const key = [
            u.liga,
            u.domacin,
            u.gost,
            u.tip,
            u.jedan
        ]
        .join("|")
        .toLowerCase();


        if (
            set.has(key)
        ) {
            return false;
        }


        set.add(key);

        return true;
    });
}


/* ---------------------------
   SORTIRANJE
--------------------------- */

function sortiraj(lista) {

    return lista.sort(
        (a, b) => {

            const A =
                REDOSLIJED[a.tip];

            const B =
                REDOSLIJED[b.tip];


            if (A !== B) {
                return A - B;
            }


            return (
                a.jedan -
                b.jedan
            );
        }
    );
}


/* ---------------------------
   PRIKAZ
--------------------------- */

function prikazi(lista) {

    const container =
        document.getElementById(
            "rezultati"
        );


    container.innerHTML = "";


    if (!lista.length) {

        container.innerHTML = `
            <div class="nema">
                Nema pronađenih utakmica koje zadovoljavaju uvjete.
            </div>
        `;

        return;
    }


    for (const tip of TIPOVI) {

        const grupa =
            lista.filter(
                u => u.tip === tip
            );


        if (!grupa.length) {
            continue;
        }


        const box =
            document.createElement(
                "div"
            );

        box.className =
            "grupa";


        const naslov =
            document.createElement(
                "h2"
            );

        naslov.textContent =
            "Tip " + tip;


        box.appendChild(
            naslov
        );


        for (const u of grupa) {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "utakmica";


            div.innerHTML = `

                <div class="par">
                    ${u.vrijeme}
                    ${u.domacin}
                    -
                    ${u.gost}
                </div>

                <div class="liga">
                    (${u.liga})
                </div>

                <div class="kvote">

                    1:
                    <strong>
                        ${u.jedan.toFixed(2)}
                    </strong>

                    &nbsp;&nbsp;

                    X:
                    ${u.x.toFixed(2)}

                    &nbsp;&nbsp;

                    2:
                    ${u.dva.toFixed(2)}

                </div>

                <div class="tip">
                    Tip: ${u.tip}
                </div>
            `;


            box.appendChild(
                div
            );
        }


        container.appendChild(
            box
        );
    }
}


/* ---------------------------
   GLAVNA FUNKCIJA
--------------------------- */

async function analizirajSlike() {

    const input =
        document.getElementById(
            "slike"
        );

    const status =
        document.getElementById(
            "status"
        );

    const gumb =
        document.getElementById(
            "gumb"
        );


    if (
        !input.files ||
        input.files.length === 0
    ) {

        alert(
            "Prvo odaberi slike."
        );

        return;
    }


    gumb.disabled =
        true;


    document.getElementById(
        "rezultati"
    ).innerHTML = "";


    let sve = [];


    try {

        for (
            let i = 0;
            i < input.files.length;
            i++
        ) {

            status.textContent =
                `Čitam sliku ${i + 1} od ${input.files.length}...`;


            const pronadjene =
                await obradiSliku(
                    input.files[i],
                    i + 1,
                    input.files.length
                );


            sve.push(
                ...pronadjene
            );
        }


        sve =
            ukloniDuplikate(
                sve
            );


        sve =
            sortiraj(
                sve
            );


        prikazi(
            sve
        );


        status.textContent =
            `Gotovo. Pronađeno utakmica: ${sve.length}`;


    }
    catch (greska) {

        console.error(
            greska
        );


        status.textContent =
            "Greška tijekom analize slike.";


        alert(
            "Dogodila se greška tijekom analize."
        );


    }
    finally {

        gumb.disabled =
            false;
    }
}

</script>

</body>
</html>
