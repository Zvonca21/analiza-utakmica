<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Analiza nogometnih utakmica</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 15px;
}

.container {
    max-width: 800px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
}

h1 {
    text-align: center;
}

input {
    width: 100%;
    margin: 15px 0;
}

button {
    width: 100%;
    padding: 14px;
    background: #222;
    color: white;
    border: 0;
    border-radius: 8px;
    font-size: 16px;
}

#status {
    margin: 15px 0;
    padding: 10px;
    background: #eee;
    border-radius: 8px;
}

.match {
    background: #fafafa;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 30px;
}

.league {
    font-weight: bold;
    margin-bottom: 8px;
}

.teams {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 12px;
}

.odds {
    display: flex;
    gap: 8px;
}

.odd {
    flex: 1;
    background: #eee;
    padding: 10px;
    text-align: center;
    border-radius: 6px;
}

.result {
    margin-top: 12px;
    padding: 10px;
    font-weight: bold;
    background: #e9f3ff;
    border-radius: 6px;
}

.warning {
    padding: 12px;
    background: #fff3cd;
    border-radius: 8px;
}
</style>
</head>

<body>

<div class="container">

<h1>Analiza nogometnih utakmica</h1>

<p>
Odaberi jednu ili više slika s ponudom.
</p>

<input
    type="file"
    id="images"
    accept="image/*"
    multiple
>

<button onclick="pokreniAnalizu()">
    ANALIZIRAJ UTAKMICE
</button>

<div id="status">
    Spremno.
</div>

<div id="rezultati"></div>

</div>

<script>

const MAX_KVOTA_DOMACIN = 1.60;

const REDOSLIJED_REZULTATA = [
    "2:0",
    "2:1",
    "3:0",
    "3:1",
    "4:0",
    "4:1"
];

async function pokreniAnalizu() {

    const slike = document.getElementById("images").files;
    const status = document.getElementById("status");
    const rezultati = document.getElementById("rezultati");

    if (slike.length === 0) {
        status.innerHTML = "Odaberi barem jednu sliku.";
        return;
    }

    rezultati.innerHTML = "";

    let tekst = "";

    for (let i = 0; i < slike.length; i++) {

        status.innerHTML =
            "Čitam sliku " +
            (i + 1) +
            " od " +
            slike.length +
            "...";

        try {

            const rezultat = await Tesseract.recognize(
                slike[i],
                "eng"
            );

            tekst += "\n" + rezultat.data.text;

        } catch (greska) {

            console.log(greska);

        }
    }

    status.innerHTML = "Čitanje završeno.";

    obradiTekst(tekst);
}


/*
==================================================
PREPOZNAVANJE UTAKMICA
==================================================
*/

function obradiTekst(tekst) {

    const redovi = tekst
        .split("\n")
        .map(x => x.trim())
        .filter(x => x.length > 0);

    const utakmice = [];

    for (let i = 0; i < redovi.length; i++) {

        const red = redovi[i];

        /*
        Tražimo tri decimalna broja koja
        predstavljaju 1 X 2.
        */

        const brojevi =
            red.match(/\b\d+[.,]\d{1,2}\b/g);

        if (!brojevi || brojevi.length < 3) {
            continue;
        }

        const kvota1 =
            parseFloat(
                brojevi[0].replace(",", ".")
            );

        const kvotaX =
            parseFloat(
                brojevi[1].replace(",", ".")
            );

        const kvota2 =
            parseFloat(
                brojevi[2].replace(",", ".")
            );

        /*
        GLAVNI FILTER

        Domaća kvota mora biti
        1.60 ili manja.
        */

        if (kvota1 > MAX_KVOTA_DOMACIN) {
            continue;
        }

        /*
        Pokušaj pronalaska naziva utakmice
        iz prethodnog retka.
        */

        let naziv = "";

        if (i > 0) {
            naziv = redovi[i - 1];
        }

        /*
        Liga se pokušava uzeti iz retka
        prije naziva utakmice.
        */

        let liga = "";

        if (i > 1) {
            liga = redovi[i - 2];
        }

        /*
        Razdvajanje domaćina i gosta.
        */

        let domacin = "";
        let gost = "";

        if (naziv.includes(" - ")) {

            const dijelovi =
                naziv.split(" - ");

            domacin = dijelovi[0].trim();
            gost = dijelovi[1].trim();

        } else if (naziv.includes(" vs ")) {

            const dijelovi =
                naziv.split(" vs ");

            domacin = dijelovi[0].trim();
            gost = dijelovi[1].trim();

        } else {

            const dijelovi =
                naziv.split(" ");

            if (dijelovi.length >= 2) {

                const sredina =
                    Math.floor(dijelovi.length / 2);

                domacin =
                    dijelovi
                    .slice(0, sredina)
                    .join(" ");

                gost =
                    dijelovi
                    .slice(sredina)
                    .join(" ");
            }
        }

        /*
        Procjena mogućeg rezultata.

        Važno:
        Ovo nije tvrdnja da kvota garantira
        rezultat. Rezultat je procjena.
        */

        const rezultat =
            procijeniRezultat(
                kvota1,
                kvotaX,
                kvota2
            );

        utakmice.push({

            liga: liga,

            domacin: domacin,

            gost: gost,

            kvota1: kvota1,

            kvotaX: kvotaX,

            kvota2: kvota2,

            rezultat: rezultat
        });
    }

    /*
    SORTIRANJE

    2:0
    2:1
    3:0
    3:1
    4:0
    4:1
    */

    utakmice.sort((a, b) => {

        return REDOSLIJED_REZULTATA.indexOf(
            a.rezultat
        )
        -
        REDOSLIJED_REZULTATA.indexOf(
            b.rezultat
        );

    });

    prikaziUtakmice(utakmice);
}


/*
==================================================
PROCJENA REZULTATA
==================================================
*/

function procijeniRezultat(k1, kx, k2) {

    /*
    Normalizirane vjerojatnosti.
    */

    const p1 = 1 / k1;
    const px = 1 / kx;
    const p2 = 1 / k2;

    const ukupno = p1 + px + p2;

    const domacin =
        p1 / ukupno;

    const gost =
        p2 / ukupno;

    /*
    Jačina domaćeg favorita.

    Ovo koristi samo za procjenu
    među šest dopuštenih rezultata.
    */

    if (domacin >= 0.72) {
        return "4:0";
    }

    if (domacin >= 0.68) {
        return "3:0";
    }

    if (domacin >= 0.64) {
        return "3:1";
    }

    if (domacin >= 0.60) {
        return "2:0";
    }

    if (domacin >= 0.55) {
        return "2:1";
    }

    return "4:1";
}


/*
==================================================
PRIKAZ
==================================================
*/

function prikaziUtakmice(utakmice) {

    const rezultati =
        document.getElementById("rezultati");

    rezultati.innerHTML = "";

    if (utakmice.length === 0) {

        rezultati.innerHTML = `
            <div class="warning">
                Nema utakmica koje zadovoljavaju
                uvjet domaće kvote ≤ 1.60.
            </div>
        `;

        return;
    }

    const naslov =
        document.createElement("h2");

    naslov.innerText =
        "Odabrane utakmice";

    rezultati.appendChild(naslov);

    utakmice.forEach((utakmica, indeks) => {

        const div =
            document.createElement("div");

        div.className = "match";

        div.innerHTML = `

            <div class="league">
                Liga: ${sigurno(utakmica.liga)}
            </div>

            <div class="teams">
                ${sigurno(utakmica.domacin)}
                -
                ${sigurno(utakmica.gost)}
            </div>

            <div class="odds">

                <div class="odd">
                    <strong>1</strong><br>
                    ${utakmica.kvota1.toFixed(2)}
                </div>

                <div class="odd">
                    <strong>X</strong><br>
                    ${utakmica.kvotaX.toFixed(2)}
                </div>

                <div class="odd">
                    <strong>2</strong><br>
                    ${utakmica.kvota2.toFixed(2)}
                </div>

            </div>

            <div class="result">
                Predviđeni rezultat:
                ${utakmica.rezultat}
            </div>
        `;

        rezultati.appendChild(div);
    });
}


/*
Zaštita prikaza teksta.
*/

function sigurno(tekst) {

    return String(tekst || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

</script>

</body>
</html>
