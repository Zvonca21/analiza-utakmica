<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analiza utakmica</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    font-family: Arial, sans-serif;
    background: #f1f3f5;
}

.container {
    max-width: 750px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 14px;
}

h1 {
    text-align: center;
}

input[type="file"] {
    width: 100%;
    margin: 15px 0;
}

button {
    width: 100%;
    padding: 14px;
    margin: 7px 0;
    border: 0;
    border-radius: 8px;
    background: #222;
    color: white;
    font-size: 16px;
}

button:disabled {
    background: #999;
}

#status {
    margin: 15px 0;
    padding: 12px;
    background: #eee;
    border-radius: 8px;
}

.match {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 25px;
    background: #fafafa;
}

.match h3 {
    margin-top: 0;
}

.league {
    font-weight: bold;
    margin-bottom: 8px;
}

.teams {
    font-size: 18px;
    font-weight: bold;
}

.odds {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
}

.odd {
    width: 31%;
    padding: 10px;
    text-align: center;
    background: #eee;
    border-radius: 7px;
}

.prediction {
    margin-top: 12px;
    padding: 12px;
    background: #eef5ff;
    border-radius: 7px;
    font-weight: bold;
}

.empty {
    padding: 15px;
    background: #fff3cd;
    border-radius: 8px;
}
</style>
</head>

<body>

<div class="container">

<h1>Analiza nogometnih utakmica</h1>

<input
    type="file"
    id="images"
    accept="image/*"
    multiple
>

<button id="analyzeButton" onclick="analyzeImages()">
    Analiziraj utakmice
</button>

<div id="status">
    Spremno.
</div>

<div id="results"></div>

</div>

<script>

const DOZVOLJENA_KVOTA = 1.60;

const REZULTATI = [
    "2:0",
    "2:1",
    "3:0",
    "3:1",
    "4:0",
    "4:1"
];

async function analyzeImages() {

    const files = document.getElementById("images").files;
    const status = document.getElementById("status");
    const button = document.getElementById("analyzeButton");

    if (files.length === 0) {
        status.innerHTML = "Prvo odaberi jednu ili više slika.";
        return;
    }

    button.disabled = true;

    let completeText = "";

    for (let i = 0; i < files.length; i++) {

        status.innerHTML =
            "Čitam sliku " +
            (i + 1) +
            " od " +
            files.length +
            "...";

        try {

            const result = await Tesseract.recognize(
                files[i],
                "eng",
                {
                    logger: info => {

                        if (info.status === "recognizing text") {

                            const progress =
                                Math.round(info.progress * 100);

                            status.innerHTML =
                                "Čitanje slike " +
                                (i + 1) +
                                ": " +
                                progress +
                                "%";
                        }
                    }
                }
            );

            completeText += "\n" + result.data.text;

        } catch (error) {

            console.log(error);
        }
    }

    status.innerHTML = "Analiza završena.";

    analizirajUtakmice(completeText);

    button.disabled = false;
}


function analizirajUtakmice(text) {

    const results =
        document.getElementById("results");

    results.innerHTML = "";

    /*
       Privremeni parser:
       traži domaću kvotu i utakmicu iz OCR teksta.
    */

    const lines = text
        .split("\n")
        .map(line => line.trim())
        .filter(line => line.length > 0);

    const utakmice = [];

    for (let i = 0; i < lines.length; i++) {

        const line = lines[i];

        /*
           Prepoznaj decimalnu kvotu.
           Primjeri:
           1.25
           1.40
           1.55
           1.60
        */

        const odds =
            line.match(/\b1[.,]\d{1,2}\b/);

        if (!odds) {
            continue;
        }

        const domacaKvota =
            parseFloat(
                odds[0].replace(",", ".")
            );

        /*
           Samo domaće kvote do 1.60.
        */

        if (domacaKvota > DOZVOLJENA_KVOTA) {
            continue;
        }

        /*
           Pokušaj pronaći naziv utakmice
           u istoj ili susjednoj liniji.
        */

        let utakmica = line;

        if (i > 0 && !/\d/.test(lines[i - 1])) {
            utakmica = lines[i - 1] + " - " + line;
        }

        /*
           Određivanje očekivanog rezultata
           prema redoslijedu dozvoljenih rezultata.

           Kasnije možemo ugraditi precizniji
           model analize.
        */

        const rezultat =
            odrediRezultat(domacaKvota);

        utakmice.push({
            tekst: utakmica,
            kvota1: domacaKvota,
            rezultat: rezultat
        });
    }

    /*
       Sortiranje:
       2:0
       2:1
       3:0
       3:1
       4:0
       4:1
    */

    utakmice.sort((a, b) => {

        return (
            REZULTATI.indexOf(a.rezultat) -
            REZULTATI.indexOf(b.rezultat)
        );
    });

    prikaziUtakmice(utakmice);
}


function odrediRezultat(kvota) {

    if (kvota <= 1.30) {
        return "2:0";
    }

    if (kvota <= 1.40) {
        return "2:1";
    }

    if (kvota <= 1.45) {
        return "3:0";
    }

    if (kvota <= 1.50) {
        return "3:1";
    }

    if (kvota <= 1.55) {
        return "4:0";
    }

    return "4:1";
}


function prikaziUtakmice(utakmice) {

    const results =
        document.getElementById("results");

    if (utakmice.length === 0) {

        results.innerHTML =
            '<div class="empty">' +
            'Nije pronađena utakmica s domaćom kvotom do 1.60.' +
            '</div>';

        return;
    }

    const naslov =
        document.createElement("h2");

    naslov.innerText =
        "Odabrane utakmice";

    results.appendChild(naslov);

    utakmice.forEach((utakmica, index) => {

        const div =
            document.createElement("div");

        div.className = "match";

        div.innerHTML = `

            <h3>Utakmica ${index + 1}</h3>

            <div class="teams">
                ${utakmica.tekst}
            </div>

            <div class="odds">

                <div class="odd">
                    <strong>1</strong><br>
                    ${utakmica.kvota1.toFixed(2)}
                </div>

                <div class="odd">
                    <strong>X</strong><br>
                    -
                </div>

                <div class="odd">
                    <strong>2</strong><br>
                    -
                </div>

            </div>

            <div class="prediction">
                Predviđeni rezultat:
                ${utakmica.rezultat}
            </div>
        `;

        results.appendChild(div);
    });
}

</script>

</body>
</html>
