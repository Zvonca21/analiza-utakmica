<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Analiza nogometnih utakmica</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 8px;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 14px;
    border-radius: 14px;
}

h1 {
    text-align: center;
    font-size: 25px;
}

.opis {
    text-align: center;
    color: #555;
    line-height: 1.5;
    margin-bottom: 20px;
}

input[type="file"] {
    width: 100%;
    margin: 15px 0;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    background: #1976d2;
    color: white;
    border: 0;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

button:disabled {
    background: #999;
}

#status {
    margin-top: 16px;
    padding: 12px;
    background: #eee;
    border-radius: 9px;
    text-align: center;
    font-weight: bold;
}

.grupa {
    margin-top: 25px;
}

.grupa h2 {
    background: #1976d2;
    color: white;
    padding: 12px;
    border-radius: 9px;
    font-size: 21px;
}

.utakmica {
    border: 1px solid #ddd;
    border-radius: 9px;
    background: #fafafa;
    padding: 13px;
    margin-bottom: 18px;
}

.par {
    font-size: 18px;
    font-weight: bold;
}

.liga {
    margin-top: 6px;
    color: #555;
    font-size: 15px;
}

.kvote {
    margin-top: 10px;
    font-size: 16px;
}

.tip {
    margin-top: 8px;
    font-size: 17px;
    font-weight: bold;
}

.nema {
    padding: 20px;
    margin-top: 20px;
    text-align: center;
    background: #fff3cd;
    border-radius: 9px;
}

details {
    margin-top: 20px;
    background: #f7f7f7;
    padding: 10px;
    border-radius: 8px;
}

pre {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

<h1>Analiza nogometnih utakmica</h1>

<div class="opis">
Prikazuju se samo tipovi
<strong>2:0, 2:1, 3:0, 3:1, 4:0 i 4:1</strong><br>
uz kvotu domaćina <strong>1.60 ili manju</strong>.
</div>

<input
    type="file"
    id="slike"
    accept="image/*"
    multiple
>

<button id="gumb" onclick="analizirajSlike()">
Analiziraj slike
</button>

<div id="status">
Spremno za analizu.
</div>

<div id="rezultati"></div>

<details>
<summary>OCR pročitao</summary>
<pre id="ocrTekst"></pre>
</details>

</div>

<script>

const TIPOVI = [
    "2:0",
    "2:1",
    "3:0",
    "3:1",
    "4:0",
    "4:1"
];

const REDOSLIJED = {
    "2:0": 0,
    "2:1": 1,
    "3:0": 2,
    "3:1": 3,
    "4:0": 4,
    "4:1": 5
};

function normalizirajRed(red) {

    return red
        .replace(/\r/g, "")
        .replace(/\t/g, " ")
        .replace(/\s+/g, " ")
        .replace(/[Oo](?=\d)/g, "0")
        .replace(/[Il](?=\d)/g, "1")
        .trim();
}

function popraviDecimalu(s) {

    if (!s) return null;

    const t = s
        .replace(",", ".")
        .replace(/[Oo]/g, "0")
        .replace(/[Il]/g, "1");

    const n = parseFloat(t);

    return isNaN(n) ? null : n;
}

function popraviTip(s) {

    if (!s) return null;

    const t = s
        .replace(/\s/g, "")
        .replace(/[;.,-]/g, ":")
        .replace(/[Oo]/g, "0")
        .replace(/[Il]/g, "1");

    const m = t.match(/[0-9]:[0-9]/);

    return m ? m[0] : null;
}

function jeLiga(red) {

    const r = red.toLowerCase();

    if (/\b\d{1,2}:\d{2}\b/.test(red)) {
        return false;
    }

    const rijeci = [
        "liga",
        "league",
        "premier",
        "premiership",
        "division",
        "división",
        "serie",
        "bundesliga",
        "superliga",
        "championship",
        "ettan",
        "allsvenskan",
        "damallsvenskan",
        "segunda",
        "primera",
        "süper",
        "snl",
        "cup"
    ];

    return rijeci.some(x => r.includes(x));
}

function izvuciUtakmicuIzReda(red, trenutnaLiga) {

    let r = normalizirajRed(red);

    const vrijemeMatch = r.match(/\b([01]?\d|2[0-3]):[0-5]\d\b/);

    if (!vrijemeMatch) {
        return null;
    }

    const vrijeme = vrijemeMatch[0];

    const tipMatch = r.match(/\b[0-9]\s*[:;.-]\s*[0-9]\b/);

    if (!tipMatch) {
        return null;
    }

    const tip = popraviTip(tipMatch[0]);

    if (!TIPOVI.includes(tip)) {
        return null;
    }

    const decimalni = [...r.matchAll(/\b\d{1,2}[.,]\d{1,2}\b/g)];

    if (decimalni.length < 3) {
        return null;
    }

    const zadnjaTri = decimalni.slice(-3);

    const q1 = popraviDecimalu(zadnjaTri[0][0]);
    const qx = popraviDecimalu(zadnjaTri[1][0]);
    const q2 = popraviDecimalu(zadnjaTri[2][0]);

    if (
        q1 === null ||
        qx === null ||
        q2 === null
    ) {
        return null;
    }

    if (q1 < 1.01 || q1 > 1.60) {
        return null;
    }

    let naziv = r;

    naziv = naziv.replace(vrijeme, " ");

    for (const m of zadnjaTri) {
        naziv = naziv.replace(m[0], " ");
    }

    naziv = naziv.replace(tipMatch[0], " ");

    naziv = naziv
        .replace(/\bMore\b/gi, " ")
        .replace(/\bTip\b/gi, " ")
        .replace(/\b1\s*X\s*2\b/gi, " ")
        .replace(/\s+/g, " ")
        .trim();

    const parMatch = naziv.match(/^(.+?)\s*-\s*(.+)$/);

    if (!parMatch) {
        return null;
    }

    const domacin = parMatch[1].trim();
    const gost = parMatch[2].trim();

    if (!domacin || !gost) {
        return null;
    }

    return {
        vrijeme,
        liga: trenutnaLiga,
        domacin,
        gost,
        jedan: q1,
        x: qx,
        dva: q2,
        tip
    };
}

function obradiOCRTekst(text) {

    const redovi = text
        .split("\n")
        .map(normalizirajRed)
        .filter(Boolean);

    let trenutnaLiga = "Nepoznata liga";

    const utakmice = [];

    for (const red of redovi) {

        if (jeLiga(red)) {

            let liga = red
                .replace(/\b1\s+X\s+2\s+Tip\b/gi, "")
                .replace(/\b1\s+x\s+2\s+tip\b/gi, "")
                .trim();

            if (liga) {
                trenutnaLiga = liga;
            }

            continue;
        }

        const utakmica =
            izvuciUtakmicuIzReda(
                red,
                trenutnaLiga
            );

        if (utakmica) {
            utakmice.push(utakmica);
        }
    }

    return utakmice;
}

function ukloniDuplikate(lista) {

    const set = new Set();

    return lista.filter(u => {

        const key = [
            u.liga,
            u.domacin,
            u.gost,
            u.tip,
            u.jedan
        ].join("|").toLowerCase();

        if (set.has(key)) {
            return false;
        }

        set.add(key);

        return true;
    });
}

function sortiraj(lista) {

    return lista.sort((a, b) => {

        const A = REDOSLIJED[a.tip];
        const B = REDOSLIJED[b.tip];

        if (A !== B) {
            return A - B;
        }

        return a.jedan - b.jedan;
    });
}

function prikazi(lista) {

    const container =
        document.getElementById("rezultati");

    container.innerHTML = "";

    if (!lista.length) {

        container.innerHTML = `
            <div class="nema">
                Nema pronađenih utakmica koje zadovoljavaju uvjete.
            </div>
        `;

        return;
    }

    for (const tip of TIPOVI) {

        const grupa =
            lista.filter(u => u.tip === tip);

        if (!grupa.length) {
            continue;
        }

        const box =
            document.createElement("div");

        box.className = "grupa";

        const h2 =
            document.createElement("h2");

        h2.textContent = "Tip " + tip;

        box.appendChild(h2);

        for (const u of grupa) {

            const div =
                document.createElement("div");

            div.className = "utakmica";

            div.innerHTML = `
                <div class="par">
                    ${u.vrijeme} ${u.domacin} - ${u.gost}
                </div>

                <div class="liga">
                    (${u.liga})
                </div>

                <div class="kvote">
                    1: <strong>${u.jedan.toFixed(2)}</strong>
                    &nbsp;&nbsp;
                    X: ${u.x.toFixed(2)}
                    &nbsp;&nbsp;
                    2: ${u.dva.toFixed(2)}
                </div>

                <div class="tip">
                    Tip: ${u.tip}
                </div>
            `;

            box.appendChild(div);
        }

        container.appendChild(box);
    }
}

async function analizirajSlike() {

    const input =
        document.getElementById("slike");

    const status =
        document.getElementById("status");

    const gumb =
        document.getElementById("gumb");

    const ocrBox =
        document.getElementById("ocrTekst");

    if (!input.files || !input.files.length) {
        alert("Prvo odaberi sliku.");
        return;
    }

    gumb.disabled = true;
    ocrBox.textContent = "";
    document.getElementById("rezultati").innerHTML = "";

    let sve = [];
    let savOCR = "";

    try {

        for (let i = 0; i < input.files.length; i++) {

            const file = input.files[i];

            const rezultat =
                await Tesseract.recognize(
                    file,
                    "eng",
                    {
                        logger: m => {

                            if (m.status === "recognizing text") {

                                const p =
                                    Math.round(m.progress * 100);

                                status.textContent =
                                    `Slika ${i + 1}/${input.files.length} - ${p}%`;
                            }
                        }
                    }
                );

            const tekst =
                rezultat.data.text || "";

            savOCR +=
                "\n\n===== SLIKA " +
                (i + 1) +
                " =====\n" +
                tekst;

            const pronadjene =
                obradiOCRTekst(tekst);

            sve.push(...pronadjene);
        }

        ocrBox.textContent = savOCR;

        sve = ukloniDuplikate(sve);
        sve = sortiraj(sve);

        prikazi(sve);

        status.textContent =
            `Gotovo. Pronađeno utakmica: ${sve.length}`;

    } catch (e) {

        console.error(e);

        status.textContent =
            "Greška tijekom analize.";

        alert("Dogodila se greška tijekom čitanja slike.");

    } finally {

        gumb.disabled = false;
    }
}

</script>

</body>
</html>
