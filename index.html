<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Analiza nogometnih utakmica</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 12px;
}

.container {
    max-width: 1000px;
    margin: auto;
    background: white;
    padding: 18px;
    border-radius: 12px;
}

h1 {
    text-align: center;
    font-size: 25px;
}

input {
    width: 100%;
    margin: 15px 0;
}

button {
    width: 100%;
    padding: 15px;
    background: #222;
    color: white;
    border: 0;
    border-radius: 8px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

#status {
    margin: 15px 0;
    padding: 12px;
    background: #eee;
    border-radius: 8px;
}

.warning {
    padding: 14px;
    background: #fff3cd;
    border-radius: 8px;
    margin-top: 15px;
}

.table-container {
    overflow-x: auto;
    margin-top: 20px;
}

table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 8px;
    min-width: 650px;
}

thead th {
    background: #222;
    color: white;
    padding: 12px 8px;
    text-align: left;
}

tbody td {
    background: #f7f7f7;
    padding: 12px 8px;
    border-top: 1px solid #ddd;
    border-bottom: 1px solid #ddd;
}

tbody td:first-child {
    border-left: 1px solid #ddd;
}

tbody td:last-child {
    border-right: 1px solid #ddd;
}

.tip {
    font-weight: bold;
    font-size: 18px;
    text-align: center;
}

.kvota {
    text-align: center;
    font-weight: bold;
}

.debug {
    margin-top: 20px;
}

.debug summary {
    cursor: pointer;
    font-weight: bold;
}

.debug pre {
    white-space: pre-wrap;
    background: #eee;
    padding: 10px;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

<h1>⚽ Analiza nogometnih utakmica</h1>

<p>
Odaberi jednu ili više slika s ponudom utakmica.
</p>

<input
    type="file"
    id="images"
    accept="image/*"
    multiple
>

<button onclick="pokreniAnalizu()">
    ANALIZIRAJ UTAKMICE
</button>

<div id="status">
    Spremno.
</div>

<div id="rezultati"></div>

</div>

<script>

const MAX_KVOTA_DOMACIN = 1.60;

const DOZVOLJENI_TIPOVI = [
    "2:0",
    "2:1",
    "3:0",
    "3:1",
    "4:0",
    "4:1"
];

const REDOSLIJED_REZULTATA = {
    "2:0": 0,
    "2:1": 1,
    "3:0": 2,
    "3:1": 3,
    "4:0": 4,
    "4:1": 5
};


async function pokreniAnalizu() {

    const slike =
        document.getElementById("images").files;

    const status =
        document.getElementById("status");

    const rezultati =
        document.getElementById("rezultati");

    if (slike.length === 0) {
        status.innerHTML =
            "Odaberi barem jednu sliku.";
        return;
    }

    rezultati.innerHTML = "";

    let cijeliTekst = "";

    for (let i = 0; i < slike.length; i++) {

        status.innerHTML =
            "Čitam sliku " +
            (i + 1) +
            " od " +
            slike.length +
            "...";

        try {

            const rezultat =
                await Tesseract.recognize(
                    slike[i],
                    "eng",
                    {
                        logger: m => {

                            if (m.status ===
                                "recognizing text") {

                                const postotak =
                                    Math.round(
                                        (m.progress || 0) * 100
                                    );

                                status.innerHTML =
                                    "Čitam sliku " +
                                    (i + 1) +
                                    " od " +
                                    slike.length +
                                    " — " +
                                    postotak +
                                    "%";
                            }
                        }
                    }
                );

            cijeliTekst +=
                "\n" +
                rezultat.data.text;

        } catch (greska) {

            console.error(greska);

            status.innerHTML =
                "Greška pri čitanju slike.";
        }
    }

    status.innerHTML =
        "Čitanje završeno. Analiziram utakmice...";

    obradiTekst(cijeliTekst);
}



/* ==========================================
   NORMALIZACIJA OCR TEKSTA
========================================== */

function normalizirajTekst(tekst) {

    return tekst
        .replace(/\r/g, "")
        .replace(/[|]/g, " ")
        .replace(/\s+/g, " ")
        .replace(/(\d)\s*[:;]\s*(\d)/g, "$1:$2")
        .replace(/(\d)\s*,\s*(\d{2})/g, "$1.$2");
}



/* ==========================================
   PREPOZNAVANJE UTAKMICA
========================================== */

function obradiTekst(tekst) {

    const originalniRedovi = tekst
        .split("\n")
        .map(r => r.trim())
        .filter(r => r.length > 0);

    const utakmice = [];

    for (let i = 0; i < originalniRedovi.length; i++) {

        /*
        Spajamo nekoliko susjednih OCR redova jer
        Tesseract ponekad razdvoji jednu utakmicu
        na više redova.
        */

        const blok = [
            originalniRedovi[i - 2] || "",
            originalniRedovi[i - 1] || "",
            originalniRedovi[i] || "",
            originalniRedovi[i + 1] || "",
            originalniRedovi[i + 2] || ""
        ].join(" ");

        const cistiBlok =
            normalizirajTekst(blok);

        /*
        Tražimo Tip sa slike.
        NE izračunavamo rezultat iz kvota.
        */

        const tipMatch =
            cistiBlok.match(
                /\b(2:0|2:1|3:0|3:1|4:0|4:1)\b/
            );

        if (!tipMatch) {
            continue;
        }

        const tip = tipMatch[1];

        if (!DOZVOLJENI_TIPOVI.includes(tip)) {
            continue;
        }

        /*
        Pronalazimo decimalne kvote.
        */

        const brojevi =
            cistiBlok.match(
                /\b\d{1,2}[.,]\d{1,2}\b/g
            );

        if (!brojevi ||
            brojevi.length < 3) {

            continue;
        }

        /*
        Tražimo grupu od 3 kvote:
        1, X i 2.
        */

        let kvota1 = null;
        let kvotaX = null;
        let kvota2 = null;

        for (let b = 0;
             b <= brojevi.length - 3;
             b++) {

            const k1 =
                parseFloat(
                    brojevi[b]
                    .replace(",", ".")
                );

            const kx =
                parseFloat(
                    brojevi[b + 1]
                    .replace(",", ".")
                );

            const k2 =
                parseFloat(
                    brojevi[b + 2]
                    .replace(",", ".")
                );

            /*
            Realan raspon nogometnih kvota.
            */

            if (
                k1 >= 1.01 &&
                k1 <= 30 &&
                kx >= 1.01 &&
                kx <= 30 &&
                k2 >= 1.01 &&
                k2 <= 50
            ) {

                kvota1 = k1;
                kvotaX = kx;
                kvota2 = k2;

                break;
            }
        }

        if (kvota1 === null) {
            continue;
        }

        /*
        VAŽNO:
        domaća kvota mora biti STROGO
        MANJA od 1.60.

        1.59 = DA
        1.60 = NE
        */

        if (kvota1 >= MAX_KVOTA_DOMACIN) {
            continue;
        }

        /*
        Pokušaj pronalaska naziva utakmice.
        */

        let naziv =
            pronadiUtakmicu(
                originalniRedovi,
                i
            );

        let domacin = "";
        let gost = "";

        if (naziv) {

            let dijelovi = null;

            if (naziv.includes(" - ")) {
                dijelovi =
                    naziv.split(" - ");
            }

            else if (
                naziv.toLowerCase()
                .includes(" vs ")
            ) {
                dijelovi =
                    naziv.split(
                        /\s+vs\s+/i
                    );
            }

            if (dijelovi &&
                dijelovi.length >= 2) {

                domacin =
                    dijelovi[0].trim();

                gost =
                    dijelovi
                    .slice(1)
                    .join(" - ")
                    .trim();
            }

            else {

                domacin = naziv;
                gost = "";
            }
        }

        const liga =
            pronadiLigu(
                originalniRedovi,
                i,
                naziv
            );

        /*
        Sprječavanje duplikata jer analiziramo
        nekoliko susjednih OCR redova.
        */

        const postoji =
            utakmice.some(u =>
                u.tip === tip &&
                Math.abs(
                    u.kvota1 - kvota1
                ) < 0.001 &&
                (
                    u.domacin === domacin ||
                    (!u.domacin && !domacin)
                )
            );

        if (postoji) {
            continue;
        }

        utakmice.push({
            liga,
            domacin,
            gost,
            kvota1,
            kvotaX,
            kvota2,
            tip
        });
    }


    /*
    SORTIRANJE PO TIPU:

    2:0
    2:1
    3:0
    3:1
    4:0
    4:1
    */

    utakmice.sort((a, b) => {

        const razlika =
            REDOSLIJED_REZULTATA[a.tip] -
            REDOSLIJED_REZULTATA[b.tip];

        if (razlika !== 0) {
            return razlika;
        }

        /*
        Unutar istog Tipa sortiramo
        od najmanje kvote domaćina.
        */

        return a.kvota1 - b.kvota1;
    });

    prikaziUtakmice(
        utakmice,
        tekst
    );
}



/* ==========================================
   PRONALAŽENJE NAZIVA UTAKMICE
========================================== */

function pronadiUtakmicu(redovi, pozicija) {

    const pocetak =
        Math.max(0, pozicija - 4);

    const kraj =
        Math.min(
            redovi.length - 1,
            pozicija + 2
        );

    /*
    Prvo tražimo red koji već sadrži
    "-" između domaćina i gosta.
    */

    for (let i = pocetak;
         i <= kraj;
         i++) {

        const r = redovi[i];

        if (
            /\s-\s/.test(r) &&
            !/\d+[.,]\d+/.test(r)
        ) {

            return ocistiNaziv(r);
        }
    }


    /*
    OCR ponekad utakmicu pročita zajedno
    s kvotama.
    */

    for (let i = pocetak;
         i <= kraj;
         i++) {

        let r = redovi[i];

        if (/\s-\s/.test(r)) {

            r = r.replace(
                /\b\d{1,2}[.,]\d{1,2}\b.*$/g,
                ""
            );

            return ocistiNaziv(r);
        }
    }

    return "";
}



function ocistiNaziv(naziv) {

    return naziv
        .replace(
            /\b(2:0|2:1|3:0|3:1|4:0|4:1)\b/g,
            ""
        )
        .replace(/\s+/g, " ")
        .trim();
}



/* ==========================================
   PRONALAŽENJE LIGE
========================================== */

function pronadiLigu(
    redovi,
    pozicija,
    naziv
) {

    const pocetak =
        Math.max(0, pozicija - 6);

    for (let i = pozicija - 1;
         i >= pocetak;
         i--) {

        const r =
            redovi[i].trim();

        if (!r) {
            continue;
        }

        if (
            naziv &&
            r.includes(naziv)
        ) {
            continue;
        }

        if (
            /\b\d{1,2}[.,]\d{1,2}\b/.test(r)
        ) {
            continue;
        }

        if (
            /\b(2:0|2:1|3:0|3:1|4:0|4:1)\b/
            .test(r)
        ) {
            continue;
        }

        if (
            /\s-\s/.test(r)
        ) {
            continue;
        }

        /*
        Česti nazivi liga / država.
        */

        if (
            /championship|league|liga|super|division|promotion|ettan|usa|sweden|switzerland|england|germany|italy|spain|france|croatia|austria|belgium|netherlands/i
            .test(r)
        ) {

            return r;
        }
    }

    return "";
}



/* ==========================================
   PRIKAZ REZULTATA U TABLICI
========================================== */

function prikaziUtakmice(
    utakmice,
    originalniTekst
) {

    const rezultati =
        document.getElementById(
            "rezultati"
        );

    const status =
        document.getElementById(
            "status"
        );

    rezultati.innerHTML = "";

    if (utakmice.length === 0) {

        status.innerHTML =
            "Analiza završena.";

        rezultati.innerHTML = `
            <div class="warning">
                <strong>Nema pronađenih utakmica.</strong>
                <br><br>
                Uvjeti:
                Tip mora biti 2:0, 2:1, 3:0,
                3:1, 4:0 ili 4:1,
                a kvota na domaćina mora biti
                <strong>manja od 1.60</strong>.
            </div>

            <details class="debug">
                <summary>
                    Prikaži tekst koji je OCR pročitao
                </summary>
                <pre>${sigurno(originalniTekst)}</pre>
            </details>
        `;

        return;
    }

    status.innerHTML =
        "Gotovo! Pronađeno utakmica: " +
        utakmice.length;

    let html = `
        <h2>Odabrane utakmice</h2>

        <div class="table-container">

        <table>

            <thead>
                <tr>
                    <th>Tip</th>
                    <th>Utakmica</th>
                    <th>Liga</th>
                    <th>1</th>
                    <th>X</th>
                    <th>2</th>
                </tr>
            </thead>

            <tbody>
    `;

    utakmice.forEach(u => {

        let utakmica = "";

        if (u.gost) {

            utakmica =
                sigurno(u.domacin) +
                " - " +
                sigurno(u.gost);

        } else {

            utakmica =
                sigurno(u.domacin) ||
                "Naziv nije prepoznat";
        }

        html += `
            <tr>

                <td class="tip">
                    ${sigurno(u.tip)}
                </td>

                <td>
                    <strong>
                        ${utakmica}
                    </strong>
                </td>

                <td>
                    ${sigurno(u.liga) || "-"}
                </td>

                <td class="kvota">
                    ${u.kvota1.toFixed(2)}
                </td>

                <td class="kvota">
                    ${u.kvotaX.toFixed(2)}
                </td>

                <td class="kvota">
                    ${u.kvota2.toFixed(2)}
                </td>

            </tr>
        `;
    });

    html += `
            </tbody>
        </table>

        </div>

        <details class="debug">
            <summary>
                Prikaži tekst koji je OCR pročitao
            </summary>

            <pre>${sigurno(originalniTekst)}</pre>
        </details>
    `;

    rezultati.innerHTML = html;
}



/* ==========================================
   ZAŠTITA HTML TEKSTA
========================================== */

function sigurno(tekst) {

    return String(tekst || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

</script>

</body>
</html>
