<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Analiza nogometnih utakmica</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 8px;
}

.container {
    max-width: 1000px;
    margin: auto;
    background: white;
    padding: 14px;
    border-radius: 12px;
}

h1 {
    text-align: center;
    font-size: 24px;
}

.opis {
    text-align: center;
    color: #555;
    margin-bottom: 20px;
}

input[type="file"] {
    width: 100%;
    margin: 15px 0;
}

button {
    width: 100%;
    padding: 14px;
    font-size: 17px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    background: #1976d2;
    color: white;
}

button:disabled {
    background: #999;
}

#status {
    margin: 15px 0;
    padding: 12px;
    background: #eee;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
}

.grupa {
    margin-top: 24px;
}

.grupa h2 {
    background: #1976d2;
    color: white;
    padding: 10px;
    border-radius: 8px;
}

.utakmica {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 18px;
    background: #fafafa;
}

.par {
    font-size: 18px;
    font-weight: bold;
}

.liga {
    margin-top: 6px;
    color: #555;
}

.kvote {
    margin-top: 10px;
}

.tip {
    margin-top: 8px;
    font-weight: bold;
}

.nema {
    padding: 20px;
    text-align: center;
    background: #fff3cd;
    border-radius: 8px;
}
</style>
</head>

<body>

<div class="container">

<h1>Analiza nogometnih utakmica</h1>

<div class="opis">
Izdvaja tipove 2:0, 2:1, 3:0, 3:1, 4:0 i 4:1
uz kvotu domaćina do 1.60.
</div>

<input type="file" id="slike" accept="image/*" multiple>

<button id="analiziraj" onclick="analizirajSlike()">
Analiziraj slike
</button>

<div id="status">Spremno.</div>

<div id="rezultati"></div>

</div>

<script>

const dozvoljeniTipovi = [
    "2:0",
    "2:1",
    "3:0",
    "3:1",
    "4:0",
    "4:1"
];

const redoslijedTipova = {
    "2:0": 1,
    "2:1": 2,
    "3:0": 3,
    "3:1": 4,
    "4:0": 5,
    "4:1": 6
};

function normalizirajTekst(text) {
    return text
        .replace(/\r/g, "")
        .replace(/[|]/g, " ")
        .replace(/\t/g, " ")
        .replace(/ +/g, " ")
        .trim();
}

function imaVrijeme(red) {
    return /\b([01]?\d|2[0-3]):[0-5]\d\b/.test(red);
}

function izvuciVrijeme(red) {
    const m = red.match(/\b([01]?\d|2[0-3]):[0-5]\d\b/);
    return m ? m[0] : "";
}

function procitajBroj(t) {

    if (!t) return null;

    let s = t
        .replace(",", ".")
        .replace(/[Oo]/g, "0")
        .replace(/[Il]/g, "1");

    const n = parseFloat(s);

    return isNaN(n) ? null : n;
}

function pronadjiTip(red) {

    const r = red
        .replace(/\s/g, "")
        .replace(/-/g, ":")
        .replace(/;/g, ":");

    for (const tip of dozvoljeniTipovi) {
        if (r.includes(tip)) {
            return tip;
        }
    }

    return null;
}

function izvuciKvote(red) {

    const matches = red.match(/\b\d{1,2}[.,]\d{1,2}\b/g);

    if (!matches || matches.length < 3) {
        return null;
    }

    const brojevi = matches
        .map(procitajBroj)
        .filter(x => x !== null);

    if (brojevi.length < 3) {
        return null;
    }

    /*
      Uzimamo zadnje tri realne decimalne kvote.
    */

    return {
        jedan: brojevi[brojevi.length - 3],
        x: brojevi[brojevi.length - 2],
        dva: brojevi[brojevi.length - 1]
    };
}

function jeZaglavlje(red) {

    const r = red.toLowerCase();

    const zabranjeno = [
        "1 x 2",
        "1x2",
        "tp",
        "more",
        "manje",
        "više",
        "kvota",
        "odds",
        "točan rezultat",
        "correct score"
    ];

    if (zabranjeno.some(x => r === x || r.includes(x))) {
        return true;
    }

    return false;
}

function izgledaKaoLiga(red) {

    if (!red) return false;

    if (imaVrijeme(red)) return false;

    if (izvuciKvote(red)) return false;

    if (pronadjiTip(red)) return false;

    if (jeZaglavlje(red)) return false;

    const r = red.trim();

    if (r.length < 3 || r.length > 80) {
        return false;
    }

    const poznateRijeci = [
        "liga",
        "league",
        "premier",
        "primera",
        "segunda",
        "serie",
        "bundesliga",
        "ligue",
        "division",
        "superliga",
        "super league",
        "championship",
        "cup",
        "kup",
        "women",
        "reserve",
        "u19",
        "u20",
        "u21",
        "u23"
    ];

    const malo = r.toLowerCase();

    if (poznateRijeci.some(x => malo.includes(x))) {
        return true;
    }

    return false;
}

function ocistiNazivParova(red) {

    return red
        .replace(/\b([01]?\d|2[0-3]):[0-5]\d\b/g, " ")
        .replace(/\b\d{1,2}[.,]\d{1,2}\b/g, " ")
        .replace(/\b[234]\s*[:\-]\s*[01]\b/g, " ")
        .replace(/\b1\s*[xX]\s*2\b/g, " ")
        .replace(/\bTP\b/gi, " ")
        .replace(/\bMore\b/gi, " ")
        .replace(/\bLess\b/gi, " ")
        .replace(/\bUnder\b/gi, " ")
        .replace(/\bOver\b/gi, " ")
        .replace(/ +/g, " ")
        .trim();
}

function razdvojiPar(naziv) {

    const separatori = [
        " - ",
        " – ",
        " — ",
        " vs ",
        " VS ",
        " v "
    ];

    for (const sep of separatori) {

        if (naziv.includes(sep)) {

            const dijelovi = naziv.split(sep);

            if (dijelovi.length >= 2) {

                return {
                    domacin: dijelovi[0].trim(),
                    gost: dijelovi.slice(1).join(sep).trim()
                };
            }
        }
    }

    return {
        domacin: naziv,
        gost: ""
    };
}

function podijeliNaUtakmice(redovi) {

    const blokovi = [];
    let trenutni = [];

    for (const red of redovi) {

        if (imaVrijeme(red)) {

            if (trenutni.length > 0) {
                blokovi.push(trenutni);
            }

            trenutni = [red];

        } else {

            if (trenutni.length > 0) {
                trenutni.push(red);
            }
        }
    }

    if (trenutni.length > 0) {
        blokovi.push(trenutni);
    }

    return blokovi;
}

function pronadjiLiguIspred(redovi, indeksPocetka) {

    for (let i = indeksPocetka - 1; i >= 0; i--) {

        const red = redovi[i];

        if (izgledaKaoLiga(red)) {
            return red;
        }

        if (imaVrijeme(red)) {
            break;
        }
    }

    return "Nepoznata liga";
}

function obradiTekst(text) {

    const tekst = normalizirajTekst(text);

    const redovi = tekst
        .split("\n")
        .map(x => x.trim())
        .filter(Boolean);

    const utakmice = [];

    let trenutnaLiga = "Nepoznata liga";

    for (let i = 0; i < redovi.length; i++) {

        const red = redovi[i];

        if (izgledaKaoLiga(red)) {
            trenutnaLiga = red;
            continue;
        }

        if (!imaVrijeme(red)) {
            continue;
        }

        let blok = red;

        /*
          Dodajemo samo retke dok ne naiđemo na NOVO vrijeme.
          Tako dvije utakmice više ne mogu biti spojene.
        */

        let j = i + 1;

        while (j < redovi.length && !imaVrijeme(redovi[j])) {

            if (izgledaKaoLiga(redovi[j])) {
                break;
            }

            blok += " " + redovi[j];
            j++;
        }

        const kvote = izvuciKvote(blok);
        const tip = pronadjiTip(blok);

        if (!kvote || !tip) {
            continue;
        }

        if (!dozvoljeniTipovi.includes(tip)) {
            continue;
        }

        if (kvote.jedan > 1.60) {
            continue;
        }

        if (
            kvote.jedan < 1.01 ||
            kvote.x < 1 ||
            kvote.dva < 1
        ) {
            continue;
        }

        let naziv = ocistiNazivParova(blok);

        /*
          Ako je OCR ubacio dodatne tekstove nakon para,
          pokušavamo ih odstraniti.
        */

        naziv = naziv
            .replace(/\b\d+\s*More\b/gi, "")
            .replace(/\bMore\b/gi, "")
            .trim();

        const par = razdvojiPar(naziv);

        utakmice.push({
            liga: trenutnaLiga,
            vrijeme: izvuciVrijeme(red),
            domacin: par.domacin,
            gost: par.gost,
            jedan: kvote.jedan,
            x: kvote.x,
            dva: kvote.dva,
            tip: tip
        });
    }

    return utakmice;
}

function ukloniDuplikate(lista) {

    const set = new Set();

    return lista.filter(u => {

        const key = [
            u.liga,
            u.vrijeme,
            u.domacin,
            u.gost,
            u.tip,
            u.jedan
        ].join("|").toLowerCase();

        if (set.has(key)) {
            return false;
        }

        set.add(key);
        return true;
    });
}

function sortiraj(lista) {

    return lista.sort((a, b) => {

        const ta = redoslijedTipova[a.tip] || 99;
        const tb = redoslijedTipova[b.tip] || 99;

        if (ta !== tb) {
            return ta - tb;
        }

        return a.jedan - b.jedan;
    });
}

function prikaziRezultate(lista) {

    const container = document.getElementById("rezultati");

    container.innerHTML = "";

    if (lista.length === 0) {

        container.innerHTML = `
            <div class="nema">
                Nema pronađenih utakmica koje zadovoljavaju uvjete.
            </div>
        `;

        return;
    }

    for (const tip of dozvoljeniTipovi) {

        const grupa = lista.filter(u => u.tip === tip);

        if (grupa.length === 0) {
            continue;
        }

        const box = document.createElement("div");
        box.className = "grupa";

        const h2 = document.createElement("h2");
        h2.textContent = "Tip " + tip;

        box.appendChild(h2);

        for (const u of grupa) {

            const div = document.createElement("div");
            div.className = "utakmica";

            const naziv = u.gost
                ? `${u.domacin} - ${u.gost}`
                : u.domacin;

            div.innerHTML = `
                <div class="par">
                    ${u.vrijeme ? u.vrijeme + " " : ""}${naziv}
                </div>

                <div class="liga">
                    (${u.liga})
                </div>

                <div class="kvote">
                    1: <strong>${u.jedan.toFixed(2)}</strong>
                    &nbsp;&nbsp;
                    X: ${u.x.toFixed(2)}
                    &nbsp;&nbsp;
                    2: ${u.dva.toFixed(2)}
                </div>

                <div class="tip">
                    Tip: ${u.tip}
                </div>
            `;

            box.appendChild(div);
        }

        container.appendChild(box);
    }
}

async function analizirajSlike() {

    const input = document.getElementById("slike");
    const status = document.getElementById("status");
    const button = document.getElementById("analiziraj");

    if (!input.files || input.files.length === 0) {
        alert("Odaberi slike.");
        return;
    }

    button.disabled = true;
    status.textContent = "Pokrećem analizu...";
    document.getElementById("rezultati").innerHTML = "";

    let sve = [];

    try {

        for (let i = 0; i < input.files.length; i++) {

            status.textContent =
                `Čitam sliku ${i + 1} od ${input.files.length}...`;

            const rezultat = await Tesseract.recognize(
                input.files[i],
                "eng",
                {
                    logger: m => {

                        if (m.status === "recognizing text") {

                            const p = Math.round(m.progress * 100);

                            status.textContent =
                                `Slika ${i + 1}/${input.files.length} - ${p}%`;
                        }
                    }
                }
            );

            const tekst = rezultat.data.text;

            console.log("OCR:", tekst);

            const pronadjene = obradiTekst(tekst);

            sve.push(...pronadjene);
        }

        sve = ukloniDuplikate(sve);
        sve = sortiraj(sve);

        prikaziRezultate(sve);

        status.textContent =
            `Gotovo. Pronađeno utakmica: ${sve.length}`;

    } catch (e) {

        console.error(e);

        status.textContent =
            "Greška tijekom analize.";

        alert("Dogodila se greška.");

    } finally {

        button.disabled = false;
    }
}

</script>

</body>
</html>
