<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Analiza nogometnih utakmica</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 8px;
}

.container {
    max-width: 1000px;
    margin: auto;
    background: white;
    padding: 14px;
    border-radius: 12px;
}

h1 {
    text-align: center;
    font-size: 24px;
    margin-bottom: 10px;
}

.opis {
    text-align: center;
    color: #555;
    font-size: 14px;
    margin-bottom: 20px;
}

input[type="file"] {
    width: 100%;
    margin: 15px 0;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    font-size: 17px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    background: #1976d2;
    color: white;
    cursor: pointer;
    margin-bottom: 10px;
}

button:disabled {
    background: #999;
    cursor: not-allowed;
}

#status {
    margin: 15px 0;
    padding: 10px;
    background: #eeeeee;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
}

#rezultati {
    margin-top: 20px;
}

.grupa {
    margin-top: 25px;
}

.grupa h2 {
    background: #1976d2;
    color: white;
    padding: 10px;
    border-radius: 8px;
    font-size: 19px;
}

.utakmica {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 16px;
    background: #fafafa;
}

.utakmica .par {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 6px;
}

.utakmica .liga {
    font-size: 14px;
    color: #555;
    margin-bottom: 8px;
}

.kvote {
    font-size: 15px;
    line-height: 1.6;
}

.tip {
    margin-top: 7px;
    font-weight: bold;
    font-size: 16px;
}

.nema {
    text-align: center;
    padding: 20px;
    background: #fff3cd;
    border-radius: 8px;
}
</style>
</head>

<body>

<div class="container">

<h1>Analiza nogometnih utakmica</h1>

<div class="opis">
Odaberi jednu ili više slika ponude utakmica.
Program izdvaja utakmice s tipovima
2:0, 2:1, 3:0, 3:1, 4:0 i 4:1
kod kojih je kvota na domaćina najviše 1.60.
</div>

<input
    type="file"
    id="slike"
    accept="image/*"
    multiple
>

<button id="analiziraj" onclick="analizirajSlike()">
Analiziraj slike
</button>

<div id="status">
Spremno za analizu.
</div>

<div id="rezultati"></div>

</div>

<script>

const dozvoljeniTipovi = [
    "2:0",
    "2:1",
    "3:0",
    "3:1",
    "4:0",
    "4:1"
];

const redoslijedTipova = {
    "2:0": 1,
    "2:1": 2,
    "3:0": 3,
    "3:1": 4,
    "4:0": 5,
    "4:1": 6
};


/* --------------------------------------------------
   ČIŠĆENJE OCR TEKSTA
-------------------------------------------------- */

function ocistiTekst(text) {

    return text
        .replace(/\r/g, "")
        .replace(/[|]/g, " ")
        .replace(/\t/g, " ")
        .replace(/ +/g, " ")
        .trim();
}


/* --------------------------------------------------
   PREPOZNAVANJE KVOTE
-------------------------------------------------- */

function procitajBroj(text) {

    if (!text) return null;

    text = text
        .replace(",", ".")
        .replace(/[Oo]/g, "0")
        .replace(/[Il]/g, "1");

    const broj = parseFloat(text);

    if (isNaN(broj)) {
        return null;
    }

    return broj;
}


/* --------------------------------------------------
   PREPOZNAVANJE TOČNOG REZULTATA
-------------------------------------------------- */

function pronadjiTip(red) {

    let normalizirano = red
        .replace(/\s/g, "")
        .replace(/;/g, ":")
        .replace(/-/g, ":");

    for (const tip of dozvoljeniTipovi) {

        if (normalizirano.includes(tip)) {
            return tip;
        }
    }

    return null;
}


/* --------------------------------------------------
   PROVJERA JE LI RED VJEROJATNO LIGA
-------------------------------------------------- */

function jeLiga(red) {

    if (!red) return false;

    const r = red.trim();

    if (r.length < 3) return false;

    /*
       Red koji sadrži više kvota nije liga
    */

    const brojevi = r.match(/\b\d+[.,]\d+\b/g);

    if (brojevi && brojevi.length >= 2) {
        return false;
    }

    /*
       Red s točnim rezultatom nije liga
    */

    if (
        /(?:2|3|4)\s*[:\-]\s*[01]/.test(r)
    ) {
        return false;
    }

    /*
       Uobičajene riječi koje se pojavljuju
       u nazivima natjecanja
    */

    const rijeciLiga = [
        "league",
        "liga",
        "premier",
        "division",
        "divizija",
        "cup",
        "kup",
        "championship",
        "bundesliga",
        "serie",
        "ligue",
        "superliga",
        "super league",
        "prva liga",
        "first league",
        "segunda",
        "primera",
        "national",
        "regional",
        "women",
        "femmes",
        "reserve",
        "u19",
        "u20",
        "u21",
        "u23"
    ];

    const malo = r.toLowerCase();

    if (
        rijeciLiga.some(x => malo.includes(x))
    ) {
        return true;
    }

    /*
       Ako nema kvota i red nije predugačak,
       može biti naziv države / natjecanja.
    */

    if (
        (!brojevi || brojevi.length === 0) &&
        r.length <= 55 &&
        !/\d{1,2}:\d{2}/.test(r)
    ) {

        const rijeci = r.split(" ");

        if (rijeci.length <= 7) {
            return true;
        }
    }

    return false;
}


/* --------------------------------------------------
   TRAŽENJE KVOTA 1 X 2
-------------------------------------------------- */

function izvuciKvote(red) {

    const matches =
        red.match(/\b\d{1,2}[.,]\d{1,2}\b/g);

    if (!matches || matches.length < 3) {
        return null;
    }

    const brojevi = matches
        .map(procitajBroj)
        .filter(x => x !== null);

    if (brojevi.length < 3) {
        return null;
    }

    /*
       Zadnje tri decimalne vrijednosti u redu
       uzimamo kao 1 X 2.
    */

    return {
        jedan: brojevi[brojevi.length - 3],
        x: brojevi[brojevi.length - 2],
        dva: brojevi[brojevi.length - 1]
    };
}


/* --------------------------------------------------
   UKLANJANJE KVOTA I TIPA IZ NAZIVA PARA
-------------------------------------------------- */

function izvuciNazivPara(red) {

    let naziv = red;

    naziv = naziv.replace(
        /\b\d{1,2}[.,]\d{1,2}\b/g,
        " "
    );

    naziv = naziv.replace(
        /\b[234]\s*[:\-]\s*[01]\b/g,
        " "
    );

    naziv = naziv.replace(
        /\b1\s+[xX]\s+2\b/g,
        " "
    );

    naziv = naziv.replace(
        / +/g,
        " "
    );

    return naziv.trim();
}


/* --------------------------------------------------
   RAZDVAJANJE DOMAĆINA I GOSTA
-------------------------------------------------- */

function podijeliPar(naziv) {

    let separatori = [
        " - ",
        " – ",
        " — ",
        " vs ",
        " VS ",
        " v "
    ];

    for (const sep of separatori) {

        if (naziv.includes(sep)) {

            const dijelovi =
                naziv.split(sep);

            if (dijelovi.length >= 2) {

                return {
                    domacin:
                        dijelovi[0].trim(),

                    gost:
                        dijelovi
                        .slice(1)
                        .join(sep)
                        .trim()
                };
            }
        }
    }

    return {
        domacin: naziv,
        gost: ""
    };
}


/* --------------------------------------------------
   PARSIRANJE OCR TEKSTA
-------------------------------------------------- */

function obradiTekst(text) {

    const tekst = ocistiTekst(text);

    const redovi = tekst
        .split("\n")
        .map(x => x.trim())
        .filter(Boolean);

    let trenutnaLiga = "Nepoznata liga";

    let utakmice = [];

    for (
        let i = 0;
        i < redovi.length;
        i++
    ) {

        const red = redovi[i];

        /*
           VAŽNO:
           Liga se ažurira samo kada naiđemo
           na red koji izgleda kao naslov lige.
           Sve sljedeće utakmice dobivaju upravo
           tu ligu dok se ne pojavi nova.
        */

        if (jeLiga(red)) {

            /*
               Ne prihvaćamo red kao ligu ako
               odmah izgleda kao utakmica.
            */

            const kvoteTest =
                izvuciKvote(red);

            const tipTest =
                pronadjiTip(red);

            if (
                !kvoteTest &&
                !tipTest
            ) {

                trenutnaLiga = red;
                continue;
            }
        }


        let kombiniraniRed = red;

        /*
           Ako su naziv utakmice i kvote
           razdvojeni u dva OCR reda,
           pokušavamo ih spojiti.
        */

        let kvote =
            izvuciKvote(kombiniraniRed);

        let tip =
            pronadjiTip(kombiniraniRed);


        if (
            (!kvote || !tip) &&
            i + 1 < redovi.length
        ) {

            const sljedeci =
                redovi[i + 1];

            const spojeni =
                red + " " + sljedeci;

            const kvoteSpojene =
                izvuciKvote(spojeni);

            const tipSpojen =
                pronadjiTip(spojeni);

            if (
                kvoteSpojene &&
                tipSpojen
            ) {

                kombiniraniRed = spojeni;

                kvote =
                    kvoteSpojene;

                tip =
                    tipSpojen;

                i++;
            }
        }


        if (!kvote || !tip) {
            continue;
        }


        /*
           Filtriranje dozvoljenih rezultata
        */

        if (
            !dozvoljeniTipovi.includes(tip)
        ) {
            continue;
        }


        /*
           Kvota na domaćina smije biti
           maksimalno 1.60
        */

        if (
            kvote.jedan > 1.60
        ) {
            continue;
        }


        /*
           Zaštita od OCR greške
        */

        if (
            kvote.jedan < 1.01 ||
            kvote.jedan > 100 ||
            kvote.x < 1 ||
            kvote.dva < 1
        ) {
            continue;
        }


        const naziv =
            izvuciNazivPara(
                kombiniraniRed
            );

        const par =
            podijeliPar(naziv);


        utakmice.push({

            liga:
                trenutnaLiga,

            domacin:
                par.domacin,

            gost:
                par.gost,

            jedan:
                kvote.jedan,

            x:
                kvote.x,

            dva:
                kvote.dva,

            tip:
                tip
        });
    }

    return utakmice;
}


/* --------------------------------------------------
   SORTIRANJE
-------------------------------------------------- */

function sortirajUtakmice(utakmice) {

    return utakmice.sort(
        (a, b) => {

            const tipA =
                redoslijedTipova[a.tip] || 99;

            const tipB =
                redoslijedTipova[b.tip] || 99;

            if (tipA !== tipB) {
                return tipA - tipB;
            }

            return (
                a.jedan -
                b.jedan
            );
        }
    );
}


/* --------------------------------------------------
   UKLANJANJE DUPLIKATA
-------------------------------------------------- */

function ukloniDuplikate(lista) {

    const vidjeno =
        new Set();

    return lista.filter(u => {

        const kljuc = [
            u.liga,
            u.domacin,
            u.gost,
            u.jedan,
            u.tip
        ]
        .join("|")
        .toLowerCase();

        if (
            vidjeno.has(kljuc)
        ) {
            return false;
        }

        vidjeno.add(kljuc);

        return true;
    });
}


/* --------------------------------------------------
   PRIKAZ REZULTATA
-------------------------------------------------- */

function prikaziRezultate(utakmice) {

    const container =
        document.getElementById(
            "rezultati"
        );

    container.innerHTML = "";

    if (
        utakmice.length === 0
    ) {

        container.innerHTML = `
            <div class="nema">
                Nema pronađenih utakmica
                koje zadovoljavaju uvjete.
            </div>
        `;

        return;
    }


    for (
        const tip of dozvoljeniTipovi
    ) {

        const grupa =
            utakmice.filter(
                u => u.tip === tip
            );

        if (
            grupa.length === 0
        ) {
            continue;
        }


        const divGrupa =
            document.createElement(
                "div"
            );

        divGrupa.className =
            "grupa";


        const naslov =
            document.createElement(
                "h2"
            );

        naslov.textContent =
            "Tip " + tip;

        divGrupa.appendChild(
            naslov
        );


        grupa.forEach(u => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "utakmica";


            const nazivPara =
                u.gost
                ? `${u.domacin} - ${u.gost}`
                : u.domacin;


            div.innerHTML = `

                <div class="par">
                    ${nazivPara}
                </div>

                <div class="liga">
                    (${u.liga})
                </div>

                <div class="kvote">

                    1:
                    <strong>
                    ${u.jedan.toFixed(2)}
                    </strong>

                    &nbsp;&nbsp;

                    X:
                    ${u.x.toFixed(2)}

                    &nbsp;&nbsp;

                    2:
                    ${u.dva.toFixed(2)}

                </div>

                <div class="tip">
                    Tip: ${u.tip}
                </div>
            `;

            divGrupa.appendChild(
                div
            );
        });


        container.appendChild(
            divGrupa
        );
    }
}


/* --------------------------------------------------
   GLAVNA FUNKCIJA
-------------------------------------------------- */

async function analizirajSlike() {

    const input =
        document.getElementById(
            "slike"
        );

    const status =
        document.getElementById(
            "status"
        );

    const button =
        document.getElementById(
            "analiziraj"
        );


    if (
        !input.files ||
        input.files.length === 0
    ) {

        alert(
            "Prvo odaberi jednu ili više slika."
        );

        return;
    }


    button.disabled =
        true;

    document.getElementById(
        "rezultati"
    ).innerHTML = "";


    let sveUtakmice = [];


    try {

        for (
            let i = 0;
            i < input.files.length;
            i++
        ) {

            const file =
                input.files[i];

            status.textContent =
                `Čitam sliku ${i + 1} od ${input.files.length}...`;


            const rezultat =
                await Tesseract.recognize(

                    file,

                    "eng",

                    {

                        logger: m => {

                            if (
                                m.status ===
                                "recognizing text"
                            ) {

                                const posto =
                                    Math.round(
                                        m.progress * 100
                                    );

                                status.textContent =
                                    `Slika ${i + 1}/${input.files.length} - ${posto}%`;
                            }
                        }
                    }
                );


            const tekst =
                rezultat.data.text;


            console.log(
                "OCR TEKST SLIKE:",
                i + 1,
                tekst
            );


            const pronadjene =
                obradiTekst(
                    tekst
                );


            sveUtakmice.push(
                ...pronadjene
            );
        }


        sveUtakmice =
            ukloniDuplikate(
                sveUtakmice
            );


        sveUtakmice =
            sortirajUtakmice(
                sveUtakmice
            );


        prikaziRezultate(
            sveUtakmice
        );


        status.textContent =
            `Gotovo. Pronađeno utakmica: ${sveUtakmice.length}`;


    }
    catch (greska) {

        console.error(
            greska
        );

        status.textContent =
            "Dogodila se greška tijekom čitanja slike.";

        alert(
            "Greška tijekom analize slike."
        );
    }
    finally {

        button.disabled =
            false;
    }
}

</script>

</body>
</html>
