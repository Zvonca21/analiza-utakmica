<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Analiza nogometnih utakmica</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 8px;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 14px;
    border-radius: 14px;
}

h1 {
    text-align: center;
    font-size: 25px;
}

.opis {
    text-align: center;
    color: #555;
    line-height: 1.5;
    margin-bottom: 20px;
}

input[type="file"] {
    width: 100%;
    margin: 15px 0;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    background: #1976d2;
    color: white;
    border: 0;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
}

button:disabled {
    background: #999;
}

#status {
    margin-top: 16px;
    padding: 12px;
    background: #eee;
    border-radius: 9px;
    text-align: center;
    font-weight: bold;
}

.grupa {
    margin-top: 25px;
}

.grupa h2 {
    background: #1976d2;
    color: white;
    padding: 12px;
    border-radius: 9px;
    font-size: 21px;
}

.utakmica {
    border: 1px solid #ddd;
    border-radius: 9px;
    background: #fafafa;
    padding: 13px;
    margin-bottom: 20px;
}

.par {
    font-size: 18px;
    font-weight: bold;
}

.liga {
    margin-top: 6px;
    color: #555;
}

.kvote {
    margin-top: 10px;
}

.tip {
    margin-top: 8px;
    font-weight: bold;
}

.nema {
    padding: 20px;
    margin-top: 20px;
    text-align: center;
    background: #fff3cd;
    border-radius: 9px;
}

details {
    margin-top: 20px;
    background: #f7f7f7;
    padding: 10px;
    border-radius: 8px;
}

pre {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

<h1>Analiza nogometnih utakmica</h1>

<div class="opis">
Prikazuju se samo tipovi
<strong>2:0, 2:1, 3:0, 3:1, 4:0 i 4:1</strong><br>
uz kvotu domaćina <strong>1.60 ili manju</strong>.
</div>

<input type="file" id="slike" accept="image/*" multiple>

<button id="gumb" onclick="analizirajSlike()">
Analiziraj slike
</button>

<div id="status">Spremno za analizu.</div>

<div id="rezultati"></div>

<details>
<summary>OCR pročitao</summary>
<pre id="ocrTekst"></pre>
</details>

</div>

<script>

const TIPOVI = [
    "2:0","2:1","3:0","3:1","4:0","4:1"
];

const REDOSLIJED = {
    "2:0":0,
    "2:1":1,
    "3:0":2,
    "3:1":3,
    "4:0":4,
    "4:1":5
};

function normaliziraj(s) {
    return String(s || "")
        .replace(/\r/g, "")
        .replace(/[|]/g, " ")
        .replace(/\t/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}


/* =========================
   VRIJEME
========================= */

function jeVrijeme(s) {
    return /^([01]?\d|2[0-3]):[0-5]\d$/.test(s);
}


/* =========================
   KVOTE
========================= */

function kvotaIzTokena(token) {

    if (!token) return null;

    let s = token
        .replace(",", ".")
        .replace(/[Oo]/g, "0")
        .replace(/[Il]/g, "1")
        .replace(/[^\d.]/g, "");

    if (!s) return null;

    if (s.includes(".")) {

        const n = parseFloat(s);

        if (n >= 1.01 && n <= 50) {
            return n;
        }

        return null;
    }

    if (!/^\d+$/.test(s)) {
        return null;
    }

    // 116 -> 1.16
    // 370 -> 3.70
    // 695 -> 6.95
    // 930 -> 9.30

    if (s.length === 3) {

        const n = parseFloat(
            s[0] + "." + s.slice(1)
        );

        if (n >= 1.01 && n <= 9.99) {
            return n;
        }
    }

    // 1550 -> 15.50
    // 2300 -> 23.00
    // 2100 -> 21.00

    if (s.length === 4) {

        const n = parseFloat(
            s.slice(0,2) + "." + s.slice(2)
        );

        if (n >= 10 && n <= 50) {
            return n;
        }
    }

    return null;
}


/* =========================
   TIP
========================= */

function tipIzTokena(token) {

    if (!token) return null;

    let s = token
        .replace(/[Oo]/g, "0")
        .replace(/[Il]/g, "1")
        .replace(/\s/g, "")
        .replace(/[;,.]/g, ":");

    let m = s.match(/^([234]):([01])$/);

    if (m) {
        return `${m[1]}:${m[2]}`;
    }

    // 20 -> 2:0
    // 21 -> 2:1
    // 30 -> 3:0
    // 31 -> 3:1
    // 40 -> 4:0
    // 41 -> 4:1

    m = s.match(/^([234])([01])$/);

    if (m) {
        return `${m[1]}:${m[2]}`;
    }

    // Spojeni OCR tipovi

    if (s === "220") return "2:0";
    if (s === "221") return "2:1";

    if (s === "330") return "3:0";
    if (s === "331") return "3:1";

    if (s === "440") return "4:0";
    if (s === "441") return "4:1";

    return null;
}


/* =========================
   PREPOZNAVANJE LIGE
========================= */

function jeLiga(red) {

    // Red s vremenom je utakmica, a ne liga
    if (
        /\b([01]?\d|2[0-3]):[0-5]\d\b/.test(red)
    ) {
        return false;
    }

    const r = red.toLowerCase();

    const pojmovi = [
        "liga",
        "league",
        "premier",
        "premiership",
        "division",
        "serie",
        "bundesliga",
        "superliga",
        "championship",
        "ettan",
        "allsvenskan",
        "damallsvenskan",
        "segunda",
        "primera",
        "snl",
        "cup"
    ];

    return pojmovi.some(
        x => r.includes(x)
    );
}


/* =========================
   ČIŠĆENJE NAZIVA LIGE
========================= */

function ocistiLigu(red) {

    let liga = normaliziraj(red);

    /*
      OCR zna staviti:

      HB Portugal Primeira Liga 1 Xx 2 Tp
      M1 Romania Liga I 1 Xx 2 Tp
      B11 Romania Liga II 1 Xx 2 Tp
      == Russia Premier League 1x 2 Tp
      = Poland III Liga - Group 1 1x 2 Tp
    */

    // Ukloni početne OCR simbole
    liga = liga.replace(
        /^[=~¥¢@#|»«]+\s*/g,
        ""
    );

    // Posebne OCR oznake ispred države
    liga = liga.replace(
        /^(HB|M1|B11|B¥|BY|Y2C|¥2¢)\s+/i,
        ""
    );

    /*
      Ukloni zaglavlje tablice na kraju:
      1 Xx 2 Tp
      1 x 2 Tp
      1 X 2 Tip
      1x 2 Tp
    */

    liga = liga.replace(
        /\s+1\s*[xX]+\s*2\s*[Tt](?:p|ip)\s*$/i,
        ""
    );

    liga = liga.replace(
        /\s+1\s*[xX]\s*2\s*$/i,
        ""
    );

    liga = liga.replace(
        /\s+1[xX]\s*2\s*[Tt](?:p|ip)\s*$/i,
        ""
    );

    // Ukloni višak simbola s početka
    liga = liga.replace(
        /^[^A-Za-zÀ-ž]+/,
        ""
    );

    // Višestruki razmaci
    liga = liga
        .replace(/\s+/g, " ")
        .trim();

    return liga || "Nepoznata liga";
}


/* =========================
   SPAJANJE OCR REDAKA
========================= */

function napraviZapise(text) {

    const redovi = text
        .split("\n")
        .map(normaliziraj)
        .filter(Boolean);

    const zapisi = [];

    let trenutnaLiga = "Nepoznata liga";
    let trenutnaUtakmica = null;


    function spremiUtakmicu() {

        if (!trenutnaUtakmica) {
            return;
        }

        zapisi.push({
            liga: trenutnaUtakmica.liga,
            tekst: normaliziraj(
                trenutnaUtakmica.tekst
            )
        });

        trenutnaUtakmica = null;
    }


    for (const red of redovi) {

        // NOVA LIGA

        if (jeLiga(red)) {

            spremiUtakmicu();

            const liga = ocistiLigu(red);

            if (liga) {
                trenutnaLiga = liga;
            }

            continue;
        }


        const vrijeme = red.match(
            /\b([01]?\d|2[0-3]):[0-5]\d\b/
        );


        // NOVA UTAKMICA

        if (vrijeme) {

            spremiUtakmicu();

            trenutnaUtakmica = {
                liga: trenutnaLiga,
                tekst: red
            };

            continue;
        }


        // NASTAVAK PRETHODNOG REDA

        if (trenutnaUtakmica) {

            trenutnaUtakmica.tekst +=
                " " + red;
        }
    }


    spremiUtakmicu();

    return zapisi;
}


/* =========================
   ANALIZA UTAKMICE
========================= */

function obradiZapis(zapis) {

    const red = normaliziraj(
        zapis.tekst
    );

    const tokeni = red.split(" ");

    if (!tokeni.length) {
        return null;
    }


    // VRIJEME

    const vrijemeIndex =
        tokeni.findIndex(jeVrijeme);

    if (vrijemeIndex === -1) {
        return null;
    }

    const vrijeme =
        tokeni[vrijemeIndex];


    // CRTICA IZMEĐU KLUBOVA

    let crticaIndex = -1;

    for (
        let i = vrijemeIndex + 1;
        i < tokeni.length;
        i++
    ) {

        if (
            tokeni[i] === "-" ||
            tokeni[i] === "–" ||
            tokeni[i] === "—"
        ) {

            crticaIndex = i;
            break;
        }
    }

    if (crticaIndex === -1) {
        return null;
    }


    // PRONAĐI TIP

    let tip = null;
    let tipIndex = -1;

    for (
        let i = tokeni.length - 1;
        i > crticaIndex;
        i--
    ) {

        const t = tipIzTokena(
            tokeni[i]
        );

        if (
            t &&
            TIPOVI.includes(t)
        ) {

            tip = t;
            tipIndex = i;
            break;
        }
    }


    if (!tip) {
        return null;
    }


    // PRONAĐI TRI KVOTE PRIJE TIPA

    const kvote = [];

    for (
        let i = tipIndex - 1;
        i > crticaIndex;
        i--
    ) {

        const k = kvotaIzTokena(
            tokeni[i]
        );

        if (k !== null) {

            kvote.unshift({
                vrijednost: k,
                index: i
            });

            if (kvote.length === 3) {
                break;
            }
        }
    }


    if (kvote.length !== 3) {
        return null;
    }


    const q1 =
        kvote[0].vrijednost;

    const qx =
        kvote[1].vrijednost;

    const q2 =
        kvote[2].vrijednost;


    // KVOTA DOMAĆINA MORA BITI <= 1.60

    if (
        q1 < 1.01 ||
        q1 > 1.60
    ) {
        return null;
    }


    // DOMAĆIN

    const domacin = tokeni
        .slice(
            vrijemeIndex + 1,
            crticaIndex
        )
        .join(" ")
        .trim();


    // GOST

    const prviKvoteIndex =
        kvote[0].index;

    const gost = tokeni
        .slice(
            crticaIndex + 1,
            prviKvoteIndex
        )
        .join(" ")
        .trim();


    if (!domacin || !gost) {
        return null;
    }


    return {
        vrijeme: vrijeme,
        liga: zapis.liga,
        domacin: domacin,
        gost: gost,
        jedan: q1,
        x: qx,
        dva: q2,
        tip: tip
    };
}


/* =========================
   OBRADA OCR-a
========================= */

function obradiOCR(text) {

    const zapisi =
        napraviZapise(text);

    const rezultat = [];

    for (const zapis of zapisi) {

        const utakmica =
            obradiZapis(zapis);

        if (utakmica) {
            rezultat.push(utakmica);
        }
    }

    return rezultat;
}


/* =========================
   UKLANJANJE DUPLIKATA
========================= */

function ukloniDuplikate(lista) {

    const seen = new Set();

    return lista.filter(u => {

        const key = [
            u.liga,
            u.domacin,
            u.gost,
            u.tip,
            u.jedan
        ]
        .join("|")
        .toLowerCase();

        if (seen.has(key)) {
            return false;
        }

        seen.add(key);

        return true;
    });
}


/* =========================
   SORTIRANJE PO TIPOVIMA
========================= */

function sortiraj(lista) {

    return lista.sort(
        (a,b) => {

            const A =
                REDOSLIJED[a.tip];

            const B =
                REDOSLIJED[b.tip];

            if (A !== B) {
                return A - B;
            }

            return a.jedan - b.jedan;
        }
    );
}


/* =========================
   PRIKAZ REZULTATA
========================= */

function prikazi(lista) {

    const container =
        document.getElementById(
            "rezultati"
        );

    container.innerHTML = "";


    if (!lista.length) {

        container.innerHTML = `
            <div class="nema">
                Nema pronađenih utakmica koje zadovoljavaju uvjete.
            </div>
        `;

        return;
    }


    for (const tip of TIPOVI) {

        const grupa =
            lista.filter(
                u => u.tip === tip
            );

        if (!grupa.length) {
            continue;
        }


        const box =
            document.createElement("div");

        box.className = "grupa";


        const naslov =
            document.createElement("h2");

        naslov.textContent =
            "Tip " + tip;

        box.appendChild(naslov);


        for (const u of grupa) {

            const div =
                document.createElement("div");

            div.className =
                "utakmica";


            div.innerHTML = `

                <div class="par">
                    ${u.vrijeme}
                    ${u.domacin}
                    -
                    ${u.gost}
                </div>

                <div class="liga">
                    (${u.liga})
                </div>

                <div class="kvote">

                    1:
                    <strong>
                    ${u.jedan.toFixed(2)}
                    </strong>

                    &nbsp;&nbsp;

                    X:
                    ${u.x.toFixed(2)}

                    &nbsp;&nbsp;

                    2:
                    ${u.dva.toFixed(2)}

                </div>

                <div class="tip">
                    Tip: ${u.tip}
                </div>
            `;


            box.appendChild(div);
        }


        container.appendChild(box);
    }
}


/* =========================
   GLAVNA FUNKCIJA
========================= */

async function analizirajSlike() {

    const input =
        document.getElementById("slike");

    const status =
        document.getElementById("status");

    const gumb =
        document.getElementById("gumb");

    const ocr =
        document.getElementById("ocrTekst");


    if (
        !input.files ||
        !input.files.length
    ) {

        alert("Prvo odaberi slike.");

        return;
    }


    gumb.disabled = true;

    document.getElementById(
        "rezultati"
    ).innerHTML = "";

    ocr.textContent = "";


    let sve = [];
    let debug = "";


    try {

        for (
            let i = 0;
            i < input.files.length;
            i++
        ) {

            const file =
                input.files[i];


            const rezultat =
                await Tesseract.recognize(
                    file,
                    "eng",
                    {

                        logger: m => {

                            if (
                                m.status ===
                                "recognizing text"
                            ) {

                                const p =
                                    Math.round(
                                        m.progress * 100
                                    );

                                status.textContent =
                                    `Slika ${i + 1}/${input.files.length} - ${p}%`;
                            }
                        }
                    }
                );


            const tekst =
                rezultat.data.text || "";


            debug +=
                `\n\n===== SLIKA ${i + 1} =====\n${tekst}`;


            const pronadjene =
                obradiOCR(tekst);


            sve.push(
                ...pronadjene
            );
        }


        sve =
            ukloniDuplikate(sve);


        sve =
            sortiraj(sve);


        prikazi(sve);


        ocr.textContent =
            debug;


        status.textContent =
            `Gotovo. Pronađeno utakmica: ${sve.length}`;


    } catch (greska) {

        console.error(greska);

        status.textContent =
            "Greška tijekom analize.";

        alert(
            "Dogodila se greška tijekom analize."
        );

    } finally {

        gumb.disabled = false;
    }
}

</script>

</body>
</html>
